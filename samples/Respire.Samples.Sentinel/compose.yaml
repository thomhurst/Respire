services:
  sentinel:
    build: .
    init: true
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:7100:7100"
      - "127.0.0.1:7101:7101"
      - "127.0.0.1:27100:27100"
      - "127.0.0.1:27101:27101"
      - "127.0.0.1:27102:27102"
    healthcheck:
      test: ["CMD", "sh", "/sample/health.sh"]
      interval: 1s
      timeout: 3s
      retries: 45
    stop_grace_period: 5s
