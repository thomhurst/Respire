name: Response routing benchmarks

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Base ref whose common ancestor with the selected workflow ref is the baseline
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  # Manual runs keep their branch scope with an empty label segment.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-response-routing-benchmarks'
    name: Response routing (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0]
    env:
      FRAMEWORK: ${{ matrix.framework }}
      REDIS_IMAGE: mirror.gcr.io/library/redis:8.10@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    steps:
      # Route Docker Hub pulls through mirror.gcr.io; see .github/actions/docker-hub-mirror.
      - name: Use Docker Hub mirror
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo cat /etc/docker/daemon.json 2>/dev/null | jq -s '(.[0] // {}) | ."registry-mirrors" = ["https://mirror.gcr.io"]' > "$RUNNER_TEMP/daemon.json"
          sudo install -m 644 "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo kill -HUP "$(pidof dockerd)"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the shared baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          baseline=$(git -C baseline rev-parse HEAD)
          candidate=$(git -C candidate rev-parse HEAD)
          common=$(git -C candidate merge-base "$baseline" "$candidate")
          git -C baseline checkout --detach "$common"
          printf 'baseline=%s\ncandidate=%s\n' "$common" "$candidate" > revisions.log
      - name: Start isolated primary, replica, Sentinel and Cluster
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name response-routing \
            -p 127.0.0.1:19580:19580 -p 127.0.0.1:19581:19581 \
            -p 127.0.0.1:19582:19582 -p 127.0.0.1:19583:19583 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/candidate/benchmarks/Respire.Benchmarks/infra/response-routing.sh,target=/response-routing.sh,readonly" \
            "$REDIS_IMAGE" sh /response-routing.sh
          for attempt in $(seq 1 60); do
            if docker exec response-routing redis-cli -p 19582 PING | grep -q PONG \
              && docker exec response-routing redis-cli -p 19583 CLUSTER INFO | grep -q 'cluster_state:ok' \
              && docker exec response-routing redis-cli -p 19581 INFO replication | grep -q 'master_link_status:up'; then
              exit 0
            fi
            sleep 1
          done
          docker logs response-routing
          exit 1
      - name: Validate and measure baseline, candidate, baseline
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/benchmarks/Respire.Benchmarks/ResponseRoutingBenchmarks.cs baseline/benchmarks/Respire.Benchmarks/
          for phase in baseline-validation candidate-validation baseline-a candidate baseline-b; do
            source=baseline
            job=Medium
            if [[ "$phase" == candidate* ]]; then source=candidate; fi
            if [[ "$phase" == *validation ]]; then job=Dry; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f "$FRAMEWORK" -- \
                --filter '*ResponseRoutingBenchmarks*' --job "$job" --exporters json markdown \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require all routes and publish comparisons
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Response routing latency\n\nPinned base and candidate commits use the same Redis topology and fixture. Compare candidate latency and completed work items against both baseline controls. Standalone uses the native fast path. These steady-state rows exclude failover and redirection.\n')
              for phase in ('baseline-validation', 'candidate-validation', 'baseline-a', 'candidate', 'baseline-b'):
                  reports = list(Path('results', phase, 'results').glob('*-report-full-compressed.json'))
                  assert len(reports) == 1, f'Missing report: {phase}'
                  cases = json.loads(reports[0].read_text())['Benchmarks']
                  assert len(cases) == 4, f'Missing routing cases: {phase}'
                  assert {case['Parameters'] for case in cases} == {f'Route={route}' for route in ('Standalone', 'Cluster', 'Sentinel', 'Replica')}, f'Unexpected routes: {phase}'
                  assert all(case.get('Statistics') and case['Statistics']['Mean'] > 0 for case in cases), phase
                  if 'validation' not in phase:
                      summary.write(f'\n### {phase}\n\n')
                      summary.write(next(Path('results', phase, 'results').glob('*-report-github.md')).read_text())
      - name: Collect Redis log and stop owned container
        if: always()
        shell: bash
        run: |
          docker logs response-routing > redis.log 2>&1 || true
          docker rm -f response-routing || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: response-routing-${{ matrix.framework }}
          path: |
            results/
            *.log
          retention-days: 30
