name: Pub/sub dispatch benchmarks

on:
  pull_request:
    paths:
      - 'src/Respire/PubSub/**'
      - 'benchmarks/Respire.Benchmarks/PubSubLookupBenchmarks.cs'
      - 'benchmarks/Respire.Benchmarks/PubSubDeliveryBenchmarks.cs'
      - 'benchmarks/Respire.Benchmarks/KeyNotificationBenchmarks.cs'
      - '.github/workflows/benchmark-pubsub.yml'

permissions:
  contents: read

concurrency:
  # A newer commit on the same PR or branch supersedes older runs. Every main commit still runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dispatch-comparison:
    name: Compare pub/sub dispatch (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Compare pinned baseline, candidate, baseline on one runner
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/benchmarks/Respire.Benchmarks/PubSubDeliveryBenchmarks.cs baseline/benchmarks/Respire.Benchmarks/
          for phase in validation baseline-a candidate baseline-b; do
            source=baseline
            job=Medium
            filter='*PubSubDeliveryBenchmarks*'
            if [ "$phase" = candidate ] || [ "$phase" = validation ]; then source=candidate; fi
            if [ "$phase" = validation ]; then job=Dry; filter='*PubSub*Benchmarks*'; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --filter "$filter" --job "$job" --exporters json markdown \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require completed measurements
        shell: python
        run: |
          import json
          from pathlib import Path
          for phase in ("validation", "baseline-a", "candidate", "baseline-b"):
              reports = list(Path("results", phase, "results").glob("*-report*.json"))
              assert reports, f"Missing benchmark results: {phase}"
              for report in reports:
                  benchmarks = json.loads(report.read_text())["Benchmarks"]
                  assert benchmarks, f"No benchmarks: {report}"
                  for benchmark in benchmarks:
                      statistics = benchmark.get("Statistics")
                      assert statistics and statistics["Mean"] > 0, f"Failed benchmark: {report}"
      - name: Publish comparison reports
        if: always()
        shell: bash
        run: |
          for phase in baseline-a candidate baseline-b; do
            echo "## $phase" >> "$GITHUB_STEP_SUMMARY"
            for report in "$GITHUB_WORKSPACE/results/$phase/results/"*-report-default.md; do
              if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pubsub-dispatch-comparison
          path: |
            results/
            *.log

  notification-parser:
    name: Measure notification parsing (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Validate then measure notification layouts
        shell: bash
        run: |
          set -euo pipefail
          for phase in validation measurements; do
            job=(--job Dry)
            if [ "$phase" = measurements ]; then job=(); fi
            dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
              --filter '*KeyNotificationBenchmarks*' "${job[@]}" --exporters json markdown \
              --artifacts "$GITHUB_WORKSPACE/notification-results/$phase" \
              > "$GITHUB_WORKSPACE/notifications-$phase.log" 2>&1
          done
      - name: Require all layouts and zero parser allocations
        shell: python
        run: |
          import json
          from pathlib import Path
          reports = list(Path("notification-results/measurements/results").glob("*-report-full-compressed.json"))
          assert reports, "No notification parser measurements"
          cases = [case for report in reports for case in json.loads(report.read_text())["Benchmarks"]]
          assert len(cases) == 4, f"Expected four notification layouts, got {len(cases)}"
          for case in cases:
              assert case["Statistics"] and case["Statistics"]["Mean"] > 0, case["FullName"]
              assert case["Memory"]["BytesAllocatedPerOperation"] == 0, case["FullName"]
      - name: Publish parser measurements
        if: always()
        shell: bash
        run: |
          for report in notification-results/measurements/results/*-report-default.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: notification-parser-measurements
          path: |
            notification-results/
            notifications-*.log
