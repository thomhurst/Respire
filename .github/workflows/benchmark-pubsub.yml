name: Pub/sub dispatch benchmarks

on:
  pull_request:
    types: [labeled]
    paths:
      - 'src/Respire/PubSub/**'
      - 'benchmarks/Respire.Benchmarks/PubSubLookupBenchmarks.cs'
      - 'benchmarks/Respire.Benchmarks/PubSubDeliveryBenchmarks.cs'
      - 'benchmarks/Respire.Benchmarks/KeyNotificationBenchmarks.cs'
      - '.github/workflows/benchmark-pubsub.yml'

permissions:
  contents: read

concurrency:
  # Reapplying the benchmark label supersedes older runs on the same PR.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dispatch-comparison:
    if: github.event.label.name == 'run-benchmarks'
    name: Compare pub/sub dispatch (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Compare pinned baseline, candidate, baseline on one runner
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/benchmarks/Respire.Benchmarks/PubSubDeliveryBenchmarks.cs baseline/benchmarks/Respire.Benchmarks/
          for phase in validation baseline-a candidate baseline-b; do
            source=baseline
            job=Medium
            filter='*PubSubDeliveryBenchmarks*'
            if [ "$phase" = candidate ] || [ "$phase" = validation ]; then source=candidate; fi
            if [ "$phase" = validation ]; then job=Dry; filter='*PubSub*Benchmarks*'; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --filter "$filter" --job "$job" --exporters json markdown --disasm --disasmDepth 3 \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require completed measurements
        shell: python
        run: |
          import json
          from pathlib import Path
          for phase in ("validation", "baseline-a", "candidate", "baseline-b"):
              reports = list(Path("results", phase, "results").glob("*-report*.json"))
              assert reports, f"Missing benchmark results: {phase}"
              for report in reports:
                  benchmarks = json.loads(report.read_text())["Benchmarks"]
                  assert benchmarks, f"No benchmarks: {report}"
                  for benchmark in benchmarks:
                      statistics = benchmark.get("Statistics")
                      assert statistics and statistics["Mean"] > 0, f"Failed benchmark: {report}"
      - name: Summarize dispatch controls and individual launches
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          phases = {}
          for phase in ("baseline-a", "candidate", "baseline-b"):
              reports = list(Path("results", phase, "results").glob("*PubSubDeliveryBenchmarks-report-full-compressed.json"))
              assert len(reports) == 1, phase
              cases = json.loads(reports[0].read_text())["Benchmarks"]
              assert len(cases) == 2, phase
              phases[phase] = {(case["Method"], case["Parameters"]): case for case in cases}
          assert phases["baseline-a"].keys() == phases["candidate"].keys() == phases["baseline-b"].keys()
          lines = ["## Dispatch versus both controls", "",
                   "Positive deltas mean slower. Individual launches retain within-run variation.", "",
                   "| Case | A ns | Candidate ns | B ns | Candidate/A | Candidate/B | Allocated B (A/candidate/B) |",
                   "| --- | ---: | ---: | ---: | ---: | ---: | ---: |"]
          for key in sorted(phases["candidate"]):
              cases = [phases[phase][key] for phase in ("baseline-a", "candidate", "baseline-b")]
              a, candidate, b = [case["Statistics"]["Mean"] for case in cases]
              allocations = [case["Memory"]["BytesAllocatedPerOperation"] for case in cases]
              assert allocations[1] <= min(allocations[0], allocations[2]), (key, allocations)
              lines.append(f"| {key} | {a:.3f} | {candidate:.3f} | {b:.3f} | "
                           f"{100*(candidate/a-1):+.2f}% | {100*(candidate/b-1):+.2f}% | {'/'.join(map(str, allocations))} |")
          lines.extend(["", "## Individual process launches", "",
                        "| Phase | Case | Launch | Mean ns | Min ns | Max ns |",
                        "| --- | --- | ---: | ---: | ---: | ---: |"])
          for phase, cases in phases.items():
              for key, case in sorted(cases.items()):
                  launches = {}
                  for measurement in case["Measurements"]:
                      if measurement["IterationStage"] == "Result" and measurement["IterationMode"] == "Workload":
                          launches.setdefault(measurement["LaunchIndex"], []).append(measurement["Nanoseconds"] / measurement["Operations"])
                  assert launches, (phase, key)
                  for launch, values in sorted(launches.items()):
                      lines.append(f"| {phase} | {key} | {launch} | {sum(values)/len(values):.3f} | {min(values):.3f} | {max(values):.3f} |")
          summary = "\n".join(lines) + "\n"
          Path("results/comparison.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
      - name: Publish comparison reports
        if: always()
        shell: bash
        run: |
          for phase in baseline-a candidate baseline-b; do
            echo "## $phase" >> "$GITHUB_STEP_SUMMARY"
            for report in "$GITHUB_WORKSPACE/results/$phase/results/"*-report-default.md; do
              if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pubsub-dispatch-comparison
          path: |
            results/
            *.log

  notification-parser:
    if: github.event.label.name == 'run-benchmarks'
    name: Measure notification parsing (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Validate then measure notification layouts
        shell: bash
        run: |
          set -euo pipefail
          for phase in validation measurements; do
            job=(--job Dry)
            if [ "$phase" = measurements ]; then job=(); fi
            dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
              --filter '*KeyNotificationBenchmarks*' "${job[@]}" --exporters json markdown \
              --artifacts "$GITHUB_WORKSPACE/notification-results/$phase" \
              > "$GITHUB_WORKSPACE/notifications-$phase.log" 2>&1
          done
      - name: Require all layouts and zero parser allocations
        shell: python
        run: |
          import json
          from pathlib import Path
          reports = list(Path("notification-results/measurements/results").glob("*-report-full-compressed.json"))
          assert reports, "No notification parser measurements"
          cases = [case for report in reports for case in json.loads(report.read_text())["Benchmarks"]]
          assert len(cases) == 4, f"Expected four notification layouts, got {len(cases)}"
          for case in cases:
              assert case["Statistics"] and case["Statistics"]["Mean"] > 0, case["FullName"]
              assert case["Memory"]["BytesAllocatedPerOperation"] == 0, case["FullName"]
      - name: Publish parser measurements
        if: always()
        shell: bash
        run: |
          for report in notification-results/measurements/results/*-report-default.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: notification-parser-measurements
          path: |
            notification-results/
            notifications-*.log
