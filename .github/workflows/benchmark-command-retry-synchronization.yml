name: Command retry synchronization diagnostics

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  collect:
    if: github.event.label.name == 'run-command-retry-synchronization-benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: mirror.gcr.io/library/redis:8.10@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: infrastructure
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4042e2685f33ac6db413b4109bcb1255c5b19f5b
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ffea094441a4542a248c83e0bb656300943f1f73
          fetch-depth: 2
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install native syscall collector
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Collect original-pair synchronization diagnostics
        run: python infrastructure/scripts/benchmarks/CommandRetrySynchronization.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: command-retry-synchronization-net10.0
          path: synchronization-results/
          if-no-files-found: error
          retention-days: 14
