name: Transport acceptance benchmarks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  # Reapplying this label supersedes its older run; unrelated labels cannot cancel it.
  # Non-label events would use an empty label segment without changing their grouping.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  transport-comparison:
    if: github.event.label.name == 'run-transport-benchmarks'
    name: Compare transport acceptance (${{ matrix.error-metrics }}, informational)
    strategy:
      fail-fast: false
      matrix:
        error-metrics: [disabled, enabled]
    runs-on: ubuntu-latest
    # Each metric mode measures eighteen cases, two launches and both bracket controls.
    # The disabled leg exceeded 45 minutes during the final baseline control.
    # Retain the full sampling profile and allow every bracket to finish.
    timeout-minutes: 60
    services:
      redis:
        image: redis:8.10@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RESPIRE_BENCH_ERRORS: ${{ matrix.error-metrics }}
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: candidate
      - name: Verify the immutable merge and derive its baseline
        id: revisions
        shell: python
        env:
          MERGE_SHA: ${{ github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          import os, re, subprocess
          for variable in ('MERGE_SHA', 'EXPECTED_HEAD_SHA', 'EVENT_BASE_SHA'):
              assert re.fullmatch(r'[0-9a-f]{40}', os.environ[variable]), 'A pinned full SHA is required'
          actual = subprocess.check_output(['git', '-C', 'candidate', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == os.environ['MERGE_SHA'], 'Wrong candidate merge'
          parents = subprocess.check_output(['git', '-C', 'candidate', 'show', '-s', '--format=%P', 'HEAD'], text=True).split()
          assert len(parents) == 2, 'Candidate must be a two-parent PR merge'
          assert parents[1] == os.environ['EXPECTED_HEAD_SHA'], 'Wrong PR head'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              print('baseline-sha=' + parents[0], file=stream)
          with open('revisions.log', 'w') as stream:
              print('merge=' + actual, 'baseline=' + parents[0],
                    'head=' + parents[1], 'event-base=' + os.environ['EVENT_BASE_SHA'], sep='\n', file=stream)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.baseline-sha }}
          path: baseline
      - name: Compare pinned baseline, candidate, baseline on one runner
        shell: bash
        run: |
          set -euo pipefail
          # The shared fixture must compile against both pinned APIs. A mismatch fails this
          # step; the always() upload below retains its phase log without masking that failure.
          cp candidate/benchmarks/Respire.Benchmarks/TransportAcceptanceBenchmarks.cs baseline/benchmarks/Respire.Benchmarks/
          cp candidate/benchmarks/Respire.Benchmarks/ErrorMetricBenchmarkScope.cs baseline/benchmarks/Respire.Benchmarks/
          cp candidate/benchmarks/Respire.Benchmarks/Program.cs baseline/benchmarks/Respire.Benchmarks/
          git -C baseline rev-parse HEAD > baseline.commit
          git -C candidate rev-parse HEAD > candidate.commit
          dotnet --info > runtime-info.log
          uname -a > host-info.log
          lscpu >> host-info.log
          for phase in validation-baseline validation-candidate baseline-a candidate baseline-b; do
            source=baseline
            job=Medium
            filter='*TransportAcceptanceBenchmarks*'
            if [ "$phase" = candidate ] || [ "$phase" = validation-candidate ]; then source=candidate; fi
            if [[ "$phase" = validation-* ]]; then job=Dry; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --transport-case-count "$GITHUB_WORKSPACE/$phase.case-count" "$job"
              /usr/bin/time -f '%U %S %P' -o "$GITHUB_WORKSPACE/$phase.cpu" \
                dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --filter "$filter" --job "$job" --exporters json markdown --disasm --disasmDepth 3 \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require completed measurements
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          for phase in ("validation-baseline", "validation-candidate", "baseline-a", "candidate", "baseline-b"):
              enabled = os.environ["RESPIRE_BENCH_ERRORS"] == "enabled"
              marker = f"ERROR_METRICS requested={enabled}; published="
              log = Path(f"{phase}.log").read_text()
              assert marker in log, f"Missing metric selection evidence: {phase}"
              if phase in ("validation-candidate", "candidate"):
                  assert marker + "True" in log, f"Candidate errors instrument was not published: {phase}"
              expected = int(Path(f"{phase}.case-count").read_text())
              assert expected > 0, f"No benchmark cases discovered: {phase}"
              reports = list(Path("results", phase, "results").glob("*-report*.json"))
              assert reports, f"Missing benchmark results: {phase}"
              for report in reports:
                  benchmarks = json.loads(report.read_text())["Benchmarks"]
                  assert len(benchmarks) == expected, f"Expected {expected} discovered benchmark cases: {report}"
                  for benchmark in benchmarks:
                      statistics = benchmark.get("Statistics")
                      assert statistics and statistics["Mean"] > 0, f"Failed benchmark: {report}"
              samples = [json.loads(line.split("TRANSPORT_MEMORY ", 1)[1])
                         for line in Path(f"{phase}.log").read_text().splitlines()
                         if line.startswith("TRANSPORT_MEMORY ")]
              stages = ("before-connect", "connected", "after-churn", "after-dispose")
              counts = [sum(sample["stage"] == stage for sample in samples) for stage in stages]
              assert min(counts) >= expected and len(set(counts)) == 1, f"Incomplete retention samples: {phase}, {counts}"
              assert {sample["connections"] for sample in samples} == {1, 2}, f"Missing connection profile: {phase}"
              assert all(sample["callerPayloadBytes"] == 5 * 1024 * 1024 + 2 * 256 * 1024
                         for sample in samples), f"Mismatched caller payload: {phase}"
      - name: Summarize candidate deltas against both controls
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          phases = {}
          for phase in ("baseline-a", "candidate", "baseline-b"):
              reports = list(Path("results", phase, "results").glob("*-report-full-compressed.json"))
              assert len(reports) == 1, f"Expected one complete report: {phase}"
              cases = json.loads(reports[0].read_text())["Benchmarks"]
              phases[phase] = {(case["Method"], case["Parameters"]): case for case in cases}
          assert phases["baseline-a"].keys() == phases["candidate"].keys() == phases["baseline-b"].keys()
          lines = ["## Candidate versus both baseline controls", "",
                   "Positive latency deltas mean slower. Throughput is operations per second derived from mean latency. Control drift shows runner variation; these are informational measurements.", "",
                   "| Case | A latency ns | Candidate latency ns | B latency ns | A ops/s | Candidate ops/s | B ops/s | Candidate/A | Candidate/B | B/A drift | Allocated B (A/candidate/B) |",
                   "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"]
          for key in sorted(phases["candidate"]):
              cases = [phases[phase][key] for phase in ("baseline-a", "candidate", "baseline-b")]
              a, candidate, b = [case["Statistics"]["Mean"] for case in cases]
              allocations = "/".join(str(case["Memory"]["BytesAllocatedPerOperation"]) for case in cases)
              lines.append(f"| {key[0]} ({key[1]}) | {a:.3f} | {candidate:.3f} | {b:.3f} | "
                           f"{1e9 / a:.2f} | {1e9 / candidate:.2f} | {1e9 / b:.2f} | "
                           f"{100 * (candidate / a - 1):+.2f}% | {100 * (candidate / b - 1):+.2f}% | "
                           f"{100 * (b / a - 1):+.2f}% | {allocations} |")
          lines.extend(["", "## Latency intervals and sample variation", "",
                        "| Phase | Case | N | Mean ns | Standard deviation ns | CV | 99.9% interval ns |",
                        "| --- | --- | ---: | ---: | ---: | ---: | --- |"])
          for phase, cases in phases.items():
              for key, case in sorted(cases.items()):
                  stats = case["Statistics"]
                  interval = stats["ConfidenceInterval"]
                  lines.append(f"| {phase} | {key[0]} ({key[1]}) | {stats['N']} | {stats['Mean']:.3f} | "
                               f"{stats['StandardDeviation']:.3f} | {100 * stats['StandardDeviation'] / stats['Mean']:.2f}% | "
                               f"{interval['Lower']:.3f}/{interval['Upper']:.3f} |")
          lines.extend(["", "## Process CPU by phase", "",
                        "CPU time includes the benchmark driver and its child processes. The dry validation phase is omitted.", "",
                        "| Phase | User CPU s | System CPU s | CPU use |",
                        "| --- | ---: | ---: | ---: |"])
          for phase in ("baseline-a", "candidate", "baseline-b"):
              user, system, percent = Path(f"{phase}.cpu").read_text().split()
              lines.append(f"| {phase} | {float(user):.2f} | {float(system):.2f} | {percent} |")
          lines.extend(["", "## Retained memory outside timed methods", "",
                        "Full-GC samples cover the whole benchmark process. Caller payloads remain referenced in every stage; these are not isolated transport allocations or proof that every byte was reclaimed.", "",
                        "| Phase | Connections | Stage | Samples | Managed bytes min/max | POH bytes min/max | POH fragmentation min/max | Working set min/max | Private memory min/max |",
                        "| --- | ---: | --- | ---: | --- | --- | --- | --- | --- |"])
          for phase in ("baseline-a", "candidate", "baseline-b"):
              samples = [json.loads(line.split("TRANSPORT_MEMORY ", 1)[1])
                         for line in Path(f"{phase}.log").read_text().splitlines()
                         if line.startswith("TRANSPORT_MEMORY ")]
              for connections in (1, 2):
                  for stage in ("before-connect", "connected", "after-churn", "after-dispose"):
                      selected = [sample for sample in samples if sample["connections"] == connections and sample["stage"] == stage]
                      ranges = [f"{min(sample[field] for sample in selected)}/{max(sample[field] for sample in selected)}"
                                for field in ("managedBytes", "pohBytes", "pohFragmentedBytes", "workingSetBytes", "privateMemoryBytes")]
                      lines.append(f"| {phase} | {connections} | {stage} | {len(selected)} | " + " | ".join(ranges) + " |")
          # Aggregating launches can hide distinct JIT/code-layout regimes. Keep each
          # process visible alongside the aggregate, and retain disassembly for diagnosis.
          lines.extend(["", "## Individual process launches", "",
                        "These are overhead-adjusted result samples, not independent repetitions of the whole experiment.", "",
                        "| Phase | Case | Launch | Mean ns | Min ns | Max ns |",
                        "| --- | --- | ---: | ---: | ---: | ---: |"])
          for phase, cases in phases.items():
              for key, case in sorted(cases.items()):
                  launches = {}
                  for measurement in case["Measurements"]:
                      if measurement["IterationStage"] == "Result" and measurement["IterationMode"] == "Workload":
                          value = measurement["Nanoseconds"] / measurement["Operations"]
                          launches.setdefault(measurement["LaunchIndex"], []).append(value)
                  assert launches, f"No per-launch result measurements: {phase}, {key}"
                  for launch, samples in sorted(launches.items()):
                      lines.append(f"| {phase} | {key[0]} ({key[1]}) | {launch} | "
                                   f"{sum(samples) / len(samples):.3f} | {min(samples):.3f} | {max(samples):.3f} |")
          summary = "\n".join(lines) + "\n"
          Path("results/comparison.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
      - name: Publish comparison reports
        if: always()
        shell: bash
        run: |
          for phase in baseline-a candidate baseline-b; do
            echo "## $phase" >> "$GITHUB_STEP_SUMMARY"
            for report in "$GITHUB_WORKSPACE/results/$phase/results/"*-report-default.md; do
              if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: transport-acceptance-comparison-${{ matrix.error-metrics }}
          path: |
            results/
            *.log
            *.case-count
            *.cpu
            *.commit
