name: Transport acceptance benchmarks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  # Reapplying the benchmark label supersedes older runs on the same PR.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  transport-comparison:
    if: github.event.label.name == 'run-transport-benchmarks'
    name: Compare transport acceptance (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:8.10@sha256:c94085d298b738be22c9ccdc0ac3761fa6649df7dd82ad1d42367f3cb9714935
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Compare pinned baseline, candidate, baseline on one runner
        shell: bash
        run: |
          set -euo pipefail
          # The shared fixture must compile against both pinned APIs. A mismatch fails this
          # step; the always() upload below retains its phase log without masking that failure.
          cp candidate/benchmarks/Respire.Benchmarks/TransportAcceptanceBenchmarks.cs baseline/benchmarks/Respire.Benchmarks/
          cp candidate/benchmarks/Respire.Benchmarks/Program.cs baseline/benchmarks/Respire.Benchmarks/
          for phase in validation baseline-a candidate baseline-b; do
            source=baseline
            job=Medium
            filter='*TransportAcceptanceBenchmarks*'
            if [ "$phase" = candidate ] || [ "$phase" = validation ]; then source=candidate; fi
            if [ "$phase" = validation ]; then job=Dry; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --transport-case-count "$GITHUB_WORKSPACE/$phase.case-count" "$job"
              /usr/bin/time -f '%U %S %P' -o "$GITHUB_WORKSPACE/$phase.cpu" \
                dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --filter "$filter" --job "$job" --exporters json markdown --disasm --disasmDepth 3 \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require completed measurements
        shell: python
        run: |
          import json
          from pathlib import Path
          for phase in ("validation", "baseline-a", "candidate", "baseline-b"):
              expected = int(Path(f"{phase}.case-count").read_text())
              assert expected > 0, f"No benchmark cases discovered: {phase}"
              reports = list(Path("results", phase, "results").glob("*-report*.json"))
              assert reports, f"Missing benchmark results: {phase}"
              for report in reports:
                  benchmarks = json.loads(report.read_text())["Benchmarks"]
                  assert len(benchmarks) == expected, f"Expected {expected} discovered benchmark cases: {report}"
                  for benchmark in benchmarks:
                      statistics = benchmark.get("Statistics")
                      assert statistics and statistics["Mean"] > 0, f"Failed benchmark: {report}"
      - name: Summarize candidate deltas against both controls
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          phases = {}
          for phase in ("baseline-a", "candidate", "baseline-b"):
              reports = list(Path("results", phase, "results").glob("*-report-full-compressed.json"))
              assert len(reports) == 1, f"Expected one complete report: {phase}"
              cases = json.loads(reports[0].read_text())["Benchmarks"]
              phases[phase] = {(case["Method"], case["Parameters"]): case for case in cases}
          assert phases["baseline-a"].keys() == phases["candidate"].keys() == phases["baseline-b"].keys()
          lines = ["## Candidate versus both baseline controls", "",
                   "Positive latency deltas mean slower. Throughput is operations per second derived from mean latency. Control drift shows runner variation; these are informational measurements.", "",
                   "| Case | A latency ns | Candidate latency ns | B latency ns | A ops/s | Candidate ops/s | B ops/s | Candidate/A | Candidate/B | B/A drift | Allocated B (A/candidate/B) |",
                   "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"]
          for key in sorted(phases["candidate"]):
              cases = [phases[phase][key] for phase in ("baseline-a", "candidate", "baseline-b")]
              a, candidate, b = [case["Statistics"]["Mean"] for case in cases]
              allocations = "/".join(str(case["Memory"]["BytesAllocatedPerOperation"]) for case in cases)
              lines.append(f"| {key[0]} ({key[1]}) | {a:.3f} | {candidate:.3f} | {b:.3f} | "
                           f"{1e9 / a:.2f} | {1e9 / candidate:.2f} | {1e9 / b:.2f} | "
                           f"{100 * (candidate / a - 1):+.2f}% | {100 * (candidate / b - 1):+.2f}% | "
                           f"{100 * (b / a - 1):+.2f}% | {allocations} |")
          lines.extend(["", "## Process CPU by phase", "",
                        "CPU time includes the benchmark driver and its child processes. The dry validation phase is omitted.", "",
                        "| Phase | User CPU s | System CPU s | CPU use |",
                        "| --- | ---: | ---: | ---: |"])
          for phase in ("baseline-a", "candidate", "baseline-b"):
              user, system, percent = Path(f"{phase}.cpu").read_text().split()
              lines.append(f"| {phase} | {float(user):.2f} | {float(system):.2f} | {percent} |")
          # Aggregating launches can hide distinct JIT/code-layout regimes. Keep each
          # process visible alongside the aggregate, and retain disassembly for diagnosis.
          lines.extend(["", "## Individual process launches", "",
                        "These are overhead-adjusted result samples, not independent repetitions of the whole experiment.", "",
                        "| Phase | Case | Launch | Mean ns | Min ns | Max ns |",
                        "| --- | --- | ---: | ---: | ---: | ---: |"])
          for phase, cases in phases.items():
              for key, case in sorted(cases.items()):
                  launches = {}
                  for measurement in case["Measurements"]:
                      if measurement["IterationStage"] == "Result" and measurement["IterationMode"] == "Workload":
                          value = measurement["Nanoseconds"] / measurement["Operations"]
                          launches.setdefault(measurement["LaunchIndex"], []).append(value)
                  assert launches, f"No per-launch result measurements: {phase}, {key}"
                  for launch, samples in sorted(launches.items()):
                      lines.append(f"| {phase} | {key[0]} ({key[1]}) | {launch} | "
                                   f"{sum(samples) / len(samples):.3f} | {min(samples):.3f} | {max(samples):.3f} |")
          summary = "\n".join(lines) + "\n"
          Path("results/comparison.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
      - name: Publish comparison reports
        if: always()
        shell: bash
        run: |
          for phase in baseline-a candidate baseline-b; do
            echo "## $phase" >> "$GITHUB_STEP_SUMMARY"
            for report in "$GITHUB_WORKSPACE/results/$phase/results/"*-report-default.md; do
              if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: transport-acceptance-comparison
          path: |
            results/
            *.log
            *.case-count
