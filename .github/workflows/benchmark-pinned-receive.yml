name: Pinned receive benchmarks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  lifetime:
    if: github.event.label.name == 'run-pinned-receive-benchmarks'
    name: Receive lifetime (${{ matrix.runner }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
        framework: [net10.0]
    steps:
      # Route Docker Hub pulls through mirror.gcr.io; see .github/actions/docker-hub-mirror.
      - name: Use Docker Hub mirror
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo cat /etc/docker/daemon.json 2>/dev/null | jq -s '(.[0] // {}) | ."registry-mirrors" = ["https://mirror.gcr.io"]' > "$RUNNER_TEMP/daemon.json"
          sudo install -m 644 "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo kill -HUP "$(pidof dockerd)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
      - name: Verify socket, TLS, growth, streaming, cancellation and shutdown
        shell: pwsh
        run: >-
          dotnet run --project tests/Respire.Tests -c Release -f ${{ matrix.framework }} --
          --treenode-filter '/*/*/(ReceiveBufferTests|RespireConnectionTests|BufferedBulkReplyTests|CanceledBulkDrainTests|BytesResponseTests|StalledDeliveryTests|TlsTests|DedicatedStreamRouteTests|DeferredStreamCommandTests|StreamedSetTests|AsyncLifecycleCancellationTests)/*'
          --minimum-expected-tests 214 --report-trx --results-directory TestResults
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: receive-lifetime-${{ matrix.runner }}-${{ matrix.framework }}
          path: TestResults/

  compare:
    if: github.event.label.name == 'run-pinned-receive-benchmarks'
    name: Receive (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/PinnedReceiveBenchmarks.cs
      filter: '*PinnedReceiveBenchmarks*'
      expected-case-count: 5
      expected-methods: Ping,Get64,GetLarge64KiB,GetPipeline128,GetConcurrent50
      runner: ${{ matrix.runner }}
      retained-memory: true
      artifact-prefix: pinned-receive-${{ matrix.runner }}
