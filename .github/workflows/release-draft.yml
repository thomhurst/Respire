name: Release Draft

# Keeps one draft release up to date with main. Its tag is one step above the last published
# release (v2.0.0-rc.2000 -> v2.0.0-rc.2001, v2.0.1 -> v2.0.2), its target is the newest main
# commit, and its notes list the pull requests merged since that release.
#
# To release, edit the draft on GitHub: change the tag to choose the version (for example v2.0.0 to
# cut the stable release, or v2.1.0 for a minor), adjust the notes, and publish it. Publishing
# creates the tag on the draft's commit and runs modular-pipeline.yml, which builds, tests and packs
# that commit with the tag's version and pushes the packages to NuGet.
#
# Every push to main rewrites the draft, so edits to it are lost if main moves before it is
# published. The draft this workflow owns carries DRAFT_MARKER in its notes; other drafts are left
# alone.

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/scripts/release-version.sh
      - .github/scripts/test-release-version.sh
      - .github/workflows/release-draft.yml

permissions: {}

# Only the newest commit's draft matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRAFT_MARKER: '<!-- release-draft -->'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Test release version helper
        run: bash .github/scripts/test-release-version.sh

      - name: Update draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"

          # The last published release, prereleases included: the most recently published release
          # whose tag is a version. releases/latest would skip prereleases such as v2.0.0-rc.2000.
          previous=""
          while IFS=$'\t' read -r _ candidate; do
            if bash .github/scripts/release-version.sh tag "$candidate" > /dev/null 2>&1; then
              previous=$candidate
              break
            fi
          done < <(gh api --paginate "$repo/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | [.published_at, .tag_name] | @tsv' | sort -r)

          if [ -n "$previous" ]; then
            version=$(bash .github/scripts/release-version.sh next "$previous")
            notes=$(gh api -X POST "$repo/releases/generate-notes" \
              -f tag_name="v$version" -f target_commitish="$GITHUB_SHA" -f previous_tag_name="$previous" \
              --jq .body)
          else
            version=0.1.0
            notes=$(gh api -X POST "$repo/releases/generate-notes" \
              -f tag_name="v$version" -f target_commitish="$GITHUB_SHA" --jq .body)
          fi

          tag="v$version"
          body="$notes"$'\n\n'"$DRAFT_MARKER"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          draft_ids=$(gh api --paginate "$repo/releases?per_page=100" \
            --jq '.[] | select(.draft and ((.body // "") | contains(env.DRAFT_MARKER))) | .id')
          draft_id=${draft_ids%%$'\n'*}

          if [ -n "$draft_id" ]; then
            method=PATCH
            endpoint="$repo/releases/$draft_id"
          else
            method=POST
            endpoint="$repo/releases"
          fi

          url=$(gh api -X "$method" "$endpoint" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$version" \
            -F draft=true -F prerelease="$prerelease" -f body="$body" --jq .html_url)

          echo "Draft release $tag for $GITHUB_SHA (previous release ${previous:-none}): $url" | tee -a "$GITHUB_STEP_SUMMARY"
