name: Sentinel ready routing benchmarks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  select:
    if: github.event.label.name == 'run-sentinel-benchmarks' || github.event.label.name == 'run-ready-strategy-benchmarks'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.modes.outputs.enabled }}
      modes: ${{ steps.modes.outputs.modes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check comparison selection
        run: python -B -m unittest discover -s scripts/benchmarks -p '*Tests.py'
      - name: Select requested comparisons
        id: modes
        run: python scripts/benchmarks/SelectSentinelBenchmarkModes.py

  compare:
    needs: select
    if: needs.select.outputs.enabled == 'true'
    name: Sentinel ready routing (${{ matrix.framework }}, ${{ matrix.baseline }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      # An older selector must not cancel a newer head or another control.
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ matrix.framework }}-${{ matrix.baseline }}-${{ github.event.label.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0]
        baseline: ${{ fromJSON(needs.select.outputs.modes) }}
    services:
      redis:
        image: mirror.gcr.io/library/redis:8.10@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
        ports: [6379:6379, 26379:26379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FRAMEWORK: ${{ matrix.framework }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SENTINEL_PORT: 26379
      EXPECTED_MERGE_SHA: ${{ github.sha }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PRE_STRATEGY_BASELINE: ${{ matrix.baseline == 'pre-strategy' }}
    steps:
      # Route Docker Hub pulls through mirror.gcr.io; see .github/actions/docker-hub-mirror.
      - name: Use Docker Hub mirror
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo cat /etc/docker/daemon.json 2>/dev/null | jq -s '(.[0] // {}) | ."registry-mirrors" = ["https://mirror.gcr.io"]' > "$RUNNER_TEMP/daemon.json"
          sudo install -m 644 "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo kill -HUP "$(pidof dockerd)"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 2
      - name: Pin the merge snapshot and its actual baseline
        id: revisions
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          def git(*arguments):
              return subprocess.check_output(['git', '-C', 'candidate', *arguments], text=True).strip()

          merge = git('rev-parse', 'HEAD')
          parents = git('show', '-s', '--format=%P', 'HEAD').split()
          if merge != os.environ['EXPECTED_MERGE_SHA']:
              raise SystemExit(f'Candidate merge changed: {merge}')
          if len(parents) != 2 or parents[1] != os.environ['EXPECTED_HEAD_SHA']:
              raise SystemExit(f'Candidate does not merge the expected PR head: {parents}')
          # The payload base can lag main; use the immutable merge's actual first parent.
          # This keeps both sources aligned even when the PR merge ref moves during the run.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'baseline_sha={parents[0]}\n')
          Path(os.environ['GITHUB_WORKSPACE'], 'comparison-revisions.txt').write_text(
              f'merge={merge}\nbaseline={parents[0]}\nhead={parents[1]}\n'
              f'event_base={os.environ["EVENT_BASE_SHA"]}\n')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.baseline_sha }}
          path: baseline
          persist-credentials: false
      - name: Restore pre-strategy dispatch for the isolated comparison
        if: env.PRE_STRATEGY_BASELINE == 'true'
        shell: bash
        run: python candidate/scripts/benchmarks/PrepareReadySendBaseline.py baseline baseline-control.json
      - name: Start Sentinel beside the shared primary
        shell: bash
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          set -euo pipefail
          docker exec -i "$REDIS_CONTAINER" sh -c 'cat > /tmp/sentinel.conf' <<'CONF'
          port 26379
          protected-mode no
          sentinel monitor mymaster 127.0.0.1 6379 1
          sentinel down-after-milliseconds mymaster 30000
          CONF
          docker exec "$REDIS_CONTAINER" redis-server /tmp/sentinel.conf --sentinel --daemonize yes
          for attempt in {1..30}; do
            if docker exec "$REDIS_CONTAINER" redis-cli -p 26379 ping | grep -qx PONG; then exit 0; fi
            sleep 1
          done
          echo 'Sentinel did not become ready.' >&2
          exit 1
      - name: Validate both builds and measure baseline, candidate, baseline
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ steps.revisions.outputs.baseline_sha }}
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          test "$(git -C candidate rev-parse HEAD^1)" = "$EXPECTED_BASE_SHA"
          test "$(git -C candidate rev-parse HEAD^2)" = "$EXPECTED_HEAD_SHA"
          cp candidate/benchmarks/Respire.Benchmarks/SentinelReadyRoutingBenchmarks.cs baseline/benchmarks/Respire.Benchmarks/
          if [[ "$PRE_STRATEGY_BASELINE" == true ]]; then
            # Keep dispatch code-generation evidence without the attached disassembler:
            # the net8 diagnostic run exited 139 after a completed Dry workload in #1074.
            export DOTNET_JitDisasm='Respire.RespireClient:* Respire.RespireClient+*:*'
            export DOTNET_JitDisasmDiffable=1
          fi
          for phase in baseline-validation candidate-validation baseline-a candidate baseline-b; do
            source=baseline
            job=Medium
            if [[ "$phase" == candidate* ]]; then source=candidate; fi
            if [[ "$phase" == *validation ]]; then job=Dry; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f "$FRAMEWORK" -- \
                --filter '*SentinelReadyRoutingBenchmarks*' --job "$job" --exporters json markdown \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require all paired cases and publish reports
        shell: python
        run: |
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('candidate/scripts/benchmarks').resolve()))
          from RequireReadySendJit import require_dispatch_evidence
          expected = {f'{route}{shape}' for route in ('Standalone', 'Sentinel') for shape in ('Ping', 'String', 'Integer', 'Bytes')}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Stable Sentinel routing before/after\n\nPinned base and matching merge candidate use the same primary. Assess paired Sentinel/standalone ratios, absolute latency, confidence intervals, allocations, and both baseline controls. A material regression blocks the change.\n')
              if os.environ['PRE_STRATEGY_BASELINE'] == 'true':
                  summary.write('\nThis baseline restores pre-strategy dispatch with a production-only reverse patch; it is not an unmodified main build. All other baseline source is unchanged.\n\n```json\n' + Path('baseline-control.json').read_text() + '```\n')
                  summary.write('\nRuntime JIT dispatch listings are retained in every phase log and require inspection before merge. No attached disassembler is used.\n')
              summary.write('\nCandidate merge and its base/head parents:\n\n' + Path('comparison-revisions.txt').read_text() + '\n')
              for phase in ('baseline-validation', 'candidate-validation', 'baseline-a', 'candidate', 'baseline-b'):
                  if os.environ['PRE_STRATEGY_BASELINE'] == 'true':
                      require_dispatch_evidence(Path(f'{phase}.log').read_text(), candidate=phase.startswith('candidate'))
                  reports = list(Path('results', phase, 'results').glob('*-report-full-compressed.json'))
                  assert len(reports) == 1, f'Missing report: {phase}'
                  cases = json.loads(reports[0].read_text())['Benchmarks']
                  assert len(cases) == 8 and {case['Method'] for case in cases} == expected, f'Missing paired cases: {phase}'
                  assert all(case.get('Statistics') and case['Statistics']['Mean'] > 0 for case in cases), phase
                  if 'validation' not in phase:
                      summary.write(f'\n### {phase}\n\n')
                      summary.write(next(Path('results', phase, 'results').glob('*-report-github.md')).read_text())
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sentinel-ready-routing-${{ matrix.framework }}-${{ matrix.baseline }}
          path: |
            results/
            *.log
            comparison-revisions.txt
            baseline-control.json
            baseline-control.patch
          retention-days: 30
