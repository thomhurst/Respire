name: Key prefix benchmarks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.label.name == 'run-key-prefix-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/KeyPrefixBenchmarks.cs
      filter: '*KeyPrefixBenchmarks*'
      expected-case-count: 11
      expected-methods: PlainStringGet,PrefixedStringGet,PlainBinaryGet,PrefixedBinaryGet,CreatePrefixView,CreatePlainBatch,CreatePrefixedBatch,ReadInitializedFacet,FixedTagLargeTextSlot,FixedTagLargeBinarySlot,SplitTagLargeTextSlot
      zero-allocation-methods: PlainStringGet,PrefixedStringGet,PlainBinaryGet,PrefixedBinaryGet,FixedTagLargeTextSlot,FixedTagLargeBinarySlot,SplitTagLargeTextSlot
      artifact-prefix: key-prefix-comparison
