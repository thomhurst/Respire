name: CI

# The single PR test workflow. Each job builds only the projects it runs, for one framework;
# the Modular Pipeline workflow compiles the whole solution for every framework and verifies the packages.
#   - net10.0 runs the full suite (RESP3). A second job reruns Respire.IntegrationTests on RESP2 so the
#     shared typed scenarios parse both reply shapes; tests that pin a protocol already cover the
#     other suites' protocol-specific behavior, so those suites run once.
#   - net8.0 runs a smoke set: the framework-conditional code paths, the fake-server
#     client path, and the public samples, including one against a real Redis container.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

concurrency:
  # A newer commit on the same PR or branch supersedes older runs. Every main commit still runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test-net10:
    # The name is a required status check.
    name: Build and Test (net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESPIRE_TEST_PROTOCOL: '3'
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build
        run: |
          for project in \
            tests/Respire.Tests \
            tests/Respire.HealthChecks.Tests \
            tests/Respire.Analyzers.Tests \
            tests/Respire.IntegrationTests \
            tests/Respire.Coordination.Tests \
            tests/Respire.Azure.Tests \
            tests/Respire.DataProtection.Tests \
            tests/Respire.Caching.Tests \
            tests/Respire.Caching.Hybrid.Tests \
            samples/Respire.Samples.Testing \
            samples/Respire.Samples.Azure
          do
            dotnet build "$project" -c Release -f net10.0
          done

      # Timing-sensitive tests carry their own limiters; the cap still guards scattered fake-server
      # timing races that surface on a 4-core runner without it.
      - name: Run Unit Tests
        run: |
          dotnet run --project tests/Respire.Tests -c Release -f net10.0 --no-build -- \
            --maximum-parallel-tests 8 \
            --results-directory "$GITHUB_WORKSPACE/TestResults" \
            --coverage \
            --coverage-output coverage.cobertura.xml \
            --coverage-output-format cobertura

      - name: Run regressions without operation tracing
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: |
          dotnet run --project tests/Respire.Tests -c Release -f net10.0 --no-build -- \
            --treenode-filter '/*/*/HedgedReadTests/*'
          dotnet run --project tests/Respire.Tests -c Release -f net10.0 --no-build -- \
            --treenode-filter '/*/*/GetStringDirectPathTests/*'

      - name: Run Health Check Tests
        run: dotnet run --project tests/Respire.HealthChecks.Tests -c Release -f net10.0 --no-build

      - name: Run Analyzer Tests
        run: dotnet run --project tests/Respire.Analyzers.Tests -c Release -f net10.0 --no-build

      - name: Run Integration Tests
        run: dotnet run --project tests/Respire.IntegrationTests -c Release -f net10.0 --no-build

      - name: Run Coordination Tests
        run: dotnet run --project tests/Respire.Coordination.Tests -c Release -f net10.0 --no-build

      - name: Run Azure Integration Tests
        run: dotnet run --project tests/Respire.Azure.Tests -c Release -f net10.0 --no-build

      - name: Run DataProtection Tests
        run: dotnet run --project tests/Respire.DataProtection.Tests -c Release -f net10.0 --no-build

      - name: Run Caching Tests
        run: |
          dotnet run --project tests/Respire.Caching.Tests -c Release -f net10.0 --no-build
          dotnet run --project tests/Respire.Caching.Hybrid.Tests -c Release -f net10.0 --no-build

      - name: Run Caching Tests on Redis 7.4
        env:
          RESPIRE_TEST_REDIS_IMAGE: redis:7.4.11-alpine
        run: >-
          dotnet run --project tests/Respire.Caching.Tests -c Release -f net10.0 --no-build --
          --report-html-filename TestResults/Respire.Caching.Tests-redis7.4-linux-net10.0-report.html

      - name: Run samples
        uses: ./.github/actions/run-samples
        with:
          framework: net10.0

      - name: Generate Code Coverage Report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -assemblyfilters:"-*Tests*;-*Benchmarks*;-*Samples*;-*Pipeline*" \
            -reporttypes:"Html;JsonSummary;MarkdownSummaryGithub;Cobertura"
          if [ -f CoverageReport/SummaryGithub.md ]; then
            cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload TUnit HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tunit-reports-net10.0
          path: '**/TestResults/*-report.html'
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: CoverageReport/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: CoverageReport/Cobertura.xml
          flags: unittests
          name: unit-tests
          fail_ci_if_error: false

  integration-tests-resp2:
    name: Integration Tests (net10.0, RESP2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESPIRE_TEST_PROTOCOL: '2'
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build
        run: dotnet build tests/Respire.IntegrationTests -c Release -f net10.0

      # Classes tagged ProtocolIndependent pin their protocol or never read RESPIRE_TEST_PROTOCOL,
      # so the RESP3 job already covers them.
      - name: Run Integration Tests
        run: >-
          dotnet run --project tests/Respire.IntegrationTests -c Release -f net10.0 --no-build --
          --treenode-filter '/*/*/*/*[Category!=ProtocolIndependent]'

      - name: Upload TUnit HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tunit-reports-net10.0-resp2
          path: '**/TestResults/*-report.html'
          retention-days: 14

  build-and-test-net8:
    # The name is a required status check. This job is a smoke run; net10.0 carries the full suite.
    name: Build and Test (net8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Repository tooling checks need no .NET build; they ride along in the lightest job.
      - name: Verify command catalog generation
        shell: pwsh
        run: ./scripts/Test-CommandCatalog.ps1

      - name: Run Python probe regression tests
        run: python3 -m unittest discover -s scripts/probes -v

      - name: Verify worktree cleanup safety
        shell: pwsh
        run: |
          foreach ($test in @('Test-MergedWorktreeSweep', 'Test-WorktreeCleanup', 'Test-WorkflowArtifactCleanup', 'Test-MergePr', 'Test-MergePrLifecycle', 'Test-ReleasedWorktreeCleanup')) {
            & pwsh -NoProfile -File "./scripts/$test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build
        run: |
          for project in \
            tests/Respire.Tests \
            samples/Respire.Samples.Testing \
            samples/Respire.Samples.Azure
          do
            dotnet build "$project" -c Release -f net8.0
          done

      # Utf8StringTests and TlsTests cover the code behind #if NET9_0_OR_GREATER / NET10_0_OR_GREATER;
      # FakeServerTests and ConnectionStringParsingTests exercise the client end to end.
      - name: Run unit smoke tests
        run: |
          dotnet run --project tests/Respire.Tests -c Release -f net8.0 --no-build -- \
            --treenode-filter '/*/*/(Utf8StringTests)|(TlsTests)|(FakeServerTests)|(ConnectionStringParsingTests)/*'

      - name: Run samples
        uses: ./.github/actions/run-samples
        with:
          framework: net8.0

      - name: Upload TUnit HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tunit-reports-net8.0
          path: '**/TestResults/*-report.html'
          retention-days: 14

  performance-validation:
    name: Performance Validation
    runs-on: ubuntu-latest
    needs: build-and-test-net10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Run Performance Benchmarks
        run: |
          cd benchmarks/Respire.Benchmarks
          timeout 10m dotnet run -c Release -f net10.0 -- \
            --filter "*Get*" \
            --exporters json markdown \
            --artifacts ./PerformanceResults \
            --memory-randomization false \
            --max-relative-error 0.05 \
            --iterationCount 10 || true

      - name: Analyze Performance Results
        run: |
          echo "## 🚀 Performance Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESULTS_DIR="benchmarks/Respire.Benchmarks/PerformanceResults/results"
          if [ -d "$RESULTS_DIR" ]; then
            for file in "$RESULTS_DIR"/*.md; do
              if [ -f "$file" ]; then
                echo "### 📈 GET Operation Performance" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY

                if grep -q "Mean" "$file"; then
                  echo "#### Key Performance Metrics:" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  grep -E "(Method|Mean|Error|StdDev|Allocated)" "$file" | head -15 >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                fi

                echo "" >> $GITHUB_STEP_SUMMARY
                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary>📄 Full Performance Report</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat "$file" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
                break
              fi
            done
          else
            echo "⚠️ Performance benchmarks timed out or failed" >> $GITHUB_STEP_SUMMARY
            echo "This is expected for quick CI runs - detailed performance testing" >> $GITHUB_STEP_SUMMARY
            echo "should be done in dedicated benchmark workflows." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Performance Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-validation
          path: benchmarks/Respire.Benchmarks/PerformanceResults/
          retention-days: 7
