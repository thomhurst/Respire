name: CI

# The single PR test workflow. Each job builds only the projects it runs, for one framework;
# the Modular Pipeline workflow compiles the whole solution for every framework and verifies the packages.
#   - net10.0 runs the full suite (RESP3), split into parallel unit-shard, integration, component and analyzer
#     jobs; "Build and Test (net10.0)" gates on them and, outside pull requests, merges coverage.
#     A second job reruns Respire.IntegrationTests on RESP2 so the
#     shared typed scenarios parse both reply shapes; tests that pin a protocol already cover the
#     other suites' protocol-specific behavior, so those suites run once.
#   - net8.0 runs a smoke set: the framework-conditional code paths, the fake-server
#     client path, and the public samples, including one against a real Redis container, plus the
#     Debug-build invariants in a parallel job. "Build and Test (net8.0)" gates on both.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # Coverage adds about 40% to the unit shards, so pull requests skip it. Main and manual runs collect
  # it, and the Codecov upload tolerates a missing report (fail_ci_if_error: false).
  COLLECT_COVERAGE: ${{ github.event_name != 'pull_request' }}
  COVERAGE_ARGS: ${{ github.event_name != 'pull_request' && '--coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura' || '' }}
  # Test jobs compile without Roslyn analyzers (source generators still run) or XML documentation.
  # The Modular Pipeline workflow builds the whole solution with both on for every pull request.
  TEST_BUILD_ARGS: -p:RunAnalyzers=false -p:GenerateDocumentationFile=false
  # Images the test jobs pull through Testcontainers, pre-pulled while they build. The Ryuk reaper
  # reference is the one Testcontainers 4.16.0 pins; update it with the package. A stale or missing
  # entry only costs the pull at test time.
  INTEGRATION_IMAGES: >-
    testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
    redis:7.0.15 redis:8.10-alpine redis:8.4-alpine redis:8.8.3-alpine redis:7.2-alpine redis:7.4-alpine
    valkey/valkey:9.0-alpine valkey/valkey:8.1-alpine valkey/valkey:9.1-alpine valkey/valkey:9-alpine
    valkey/valkey:9.1.0-alpine redis:6.2.14-alpine redis:6.2-alpine redis:7.4.11-alpine redis:8.2-alpine
    redis:8.6-alpine redis:8.8-alpine
  COMPONENT_IMAGES: >-
    testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
    redis:7.0.15 redis:7.2-alpine redis:7.4-alpine redis:8.10-alpine redis:7.4.11-alpine redis:7.2.11-alpine
    valkey/valkey:8.1-alpine
  NET8_IMAGES: >-
    testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
    redis:7.0.15 redis:7.2.11-alpine redis:7.2-alpine valkey/valkey:8.1-alpine

permissions:
  contents: read

concurrency:
  # A newer commit on the same PR or branch supersedes older runs. Every main commit still runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  public-api-lifecycle:
    name: Shipping API lifecycle (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Validate deprecation metadata in every shipping assembly
        run: >-
          dotnet run --project tests/Respire.PublicApi.Tests -c Release -f ${{ matrix.framework }} --
          --minimum-expected-tests 15

  vector-data:
    name: VectorData contracts and NativeAOT (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    services:
      redis:
        image: mirror.gcr.io/library/redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 3s --health-retries 30
    env:
      TUNIT_DISABLE_HTML_REPORTER: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Run hash, JSON and hybrid collection contracts on RESP2 and RESP3
        run: >-
          dotnet run --project tests/Respire.VectorData.Tests -c Release -f ${{ matrix.framework }} --
          --minimum-expected-tests 219 --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults/vector-data"
      - name: Run semantic chat cache contracts on RESP2 and RESP3
        run: >-
          dotnet run --project tests/Respire.AI.Tests -c Release -f ${{ matrix.framework }} --
          --minimum-expected-tests 34 --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults/semantic-cache"
      - name: Run pinned official hash and JSON conformance on RESP2 and RESP3
        if: matrix.framework == 'net10.0'
        env:
          RESPIRE_VECTOR_CONFORMANCE_CONNECTION: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}
        run: >-
          dotnet run --project tests/Respire.VectorData.Conformance.Tests -c Release -f net10.0 --
          --filter-not-trait 'Unsupported=*' --minimum-expected-tests 493 --fail-skips on --report-xunit-trx
          --results-directory "$GITHUB_WORKSPACE/TestResults/vector-data-official"
      - name: Enforce official suite completeness and reviewed backend exclusions
        if: matrix.framework == 'net10.0'
        run: >-
          dotnet run --project tests/Respire.VectorData.Conformance.Tests -c Release -f net10.0 --no-build --
          --filter-class '*ConformanceCoverageTests' --minimum-expected-tests 9 --fail-skips on
      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish native sample with trimming warnings as errors
        run: >-
          dotnet publish samples/Respire.Samples.VectorData -c Release -f ${{ matrix.framework }}
          -r linux-x64 -o "$GITHUB_WORKSPACE/artifacts/vector-data"
      - name: Run native hash, generated nested JSON, batch CRUD, Flat/HNSW and hybrid smoke on both protocols
        run: >-
          ./artifacts/vector-data/Respire.Samples.VectorData
          redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vector-data-contracts-${{ matrix.framework }}
          path: |
            TestResults/vector-data
            TestResults/vector-data-official
            TestResults/semantic-cache

  stackexchange-interop:
    name: StackExchange compatibility (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    env:
      TUNIT_DISABLE_HTML_REPORTER: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Build compatibility boundary
        run: dotnet build tests/Respire.StackExchangeCompat.Tests -c Release -f ${{ matrix.framework }}
      - name: Verify unsupported-member scaffold
        if: matrix.framework == 'net10.0'
        shell: pwsh
        run: |
          $assets = Get-Content tests/Respire.StackExchangeCompat.Tests/obj/project.assets.json -Raw | ConvertFrom-Json
          $package = $assets.libraries.PSObject.Properties | Where-Object Name -Like 'StackExchange.Redis/*'
          $packageRoot = $assets.packageFolders.PSObject.Properties.Name | Select-Object -First 1
          $assembly = Join-Path $packageRoot "$($package.Value.path)/lib/net10.0/StackExchange.Redis.dll"
          ./tools/Generate-StackExchangeCompat.ps1 -AssemblyPath $assembly
          git diff --exit-code -- 'src/Respire.StackExchangeCompat/*.Unsupported.g.cs'
      - name: Test RESP2 and RESP3 conversion, cache and DataProtection against Redis
        shell: bash
        run: |
          for protocol in 2 3; do
            RESPIRE_TEST_PROTOCOL="$protocol" dotnet run --project tests/Respire.StackExchangeCompat.Tests -c Release \
              -f ${{ matrix.framework }} --no-build -- --minimum-expected-tests 219 --report-trx \
              --results-directory "TestResults/stackexchange/${{ matrix.framework }}/resp$protocol"
          done
      - name: Build pinned Hangfire upstream acceptance
        run: dotnet build tests/Respire.Hangfire.Acceptance.Tests -c Release -f ${{ matrix.framework }}
      - name: Test pinned Hangfire suite and worker lifecycle on RESP2 and RESP3
        shell: bash
        run: |
          # 95 cases: 93 ported upstream facts and 2 worker lifecycle cases.
          for protocol in 2 3; do
            RESPIRE_TEST_PROTOCOL="$protocol" dotnet run --project tests/Respire.Hangfire.Acceptance.Tests -c Release \
              -f ${{ matrix.framework }} --no-build -- --minimum-expected-tests 95 --report-trx \
              --results-directory "TestResults/hangfire/${{ matrix.framework }}/resp$protocol"
          done
      - name: Build pinned Orleans provider acceptance
        run: dotnet build tests/Respire.Orleans.Acceptance.Tests -c Release -f ${{ matrix.framework }}
      - name: Test Orleans providers, topology recovery and silo death on RESP2 and RESP3
        shell: bash
        run: |
          for protocol in 2 3; do
            RESPIRE_TEST_PROTOCOL="$protocol" dotnet run --project tests/Respire.Orleans.Acceptance.Tests -c Release \
              -f ${{ matrix.framework }} --no-build -- --minimum-expected-tests 27 --report-trx \
              --results-directory "TestResults/orleans/${{ matrix.framework }}/resp$protocol"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stackexchange-compatibility-${{ matrix.framework }}
          path: TestResults/stackexchange
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hangfire-acceptance-${{ matrix.framework }}
          path: TestResults/hangfire
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: orleans-assessment-${{ matrix.framework }}
          path: TestResults/orleans

  mapper-native-aot:
    name: Generated mapper Native AOT (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    services:
      redis:
        image: mirror.gcr.io/library/redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet
      - name: Record SDK and runtime toolchain
        run: dotnet --info
      - name: Publish trimmed Native AOT mapper sample
        run: >-
          dotnet publish samples/Respire.Samples.Mappers -c Release -f ${{ matrix.framework }}
          -r linux-x64 -o artifacts/mapper-aot/${{ matrix.framework }}
      - name: Execute hash, JSON and Search conformance with RESP2 and RESP3
        run: >-
          artifacts/mapper-aot/${{ matrix.framework }}/Respire.Samples.Mappers
          redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}

  benchmark-policy:
    name: Benchmark label cancellation policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify policy and rejection controls
        run: |
          python -B -m unittest discover -s scripts/workflows -p '*Tests.py'
          python -B -m unittest discover -s scripts/benchmarks -p '*Tests.py'
          python scripts/workflows/BenchmarkWorkflowPolicy.py

  repository-tooling:
    name: Repository tooling checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # These checks need no .NET build, so they run beside the test jobs instead of inside one.
      - name: Verify command catalog generation
        shell: pwsh
        run: ./scripts/Test-CommandCatalog.ps1

      - name: Run Python probe regression tests
        run: python3 -m unittest discover -s scripts/probes -v

      - name: Verify batch diagnostic build provenance
        shell: pwsh
        run: ./scripts/Test-TransportBatchDiagnostics.ps1

      - name: Verify worktree cleanup safety
        shell: pwsh
        run: |
          foreach ($test in @('Test-MergedWorktreeSweep', 'Test-WorktreeCleanup', 'Test-WorkflowArtifactCleanup', 'Test-MergePr', 'Test-MergePrLifecycle', 'Test-ReleasedWorktreeCleanup', 'Test-ReviewThreadReply')) {
            & pwsh -NoProfile -File "./scripts/$test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }

  observability-sample:
    name: Prometheus dashboard smoke (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet
      - name: Export measurements and evaluate pinned dashboard queries
        shell: pwsh
        run: >-
          & samples/Respire.Samples.Observability/Smoke.ps1
          -Framework '${{ matrix.framework }}'
          -OutputDirectory '${{ runner.temp }}/observability'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: observability-${{ matrix.framework }}
          path: ${{ runner.temp }}/observability

  aspire-integration:
    name: Aspire Redis and Valkey integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUNIT_DISABLE_HTML_REPORTER: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet
      - name: Build .NET 10 Aspire sample and test host
        run: |
          dotnet build samples/Respire.Samples.Aspire.AppHost -c Release -f net10.0
          dotnet build tests/Aspire.Respire.IntegrationTests -c Release -f net10.0
      - name: Verify injected clients and HTTP caches
        run: >-
          dotnet run --project tests/Aspire.Respire.IntegrationTests -c Release --no-build --
          --minimum-expected-tests 1 --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults/aspire"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aspire-integration
          path: TestResults/aspire

  aspnet-sample:
    name: ASP.NET Core sample (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    services:
      redis:
        image: mirror.gcr.io/library/redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet
      - name: Build sample
        run: dotnet build samples/Respire.Samples.AspNetCore -c Release -f ${{ matrix.framework }}
      - name: Verify HTTP caches against Redis
        shell: bash
        env:
          ConnectionStrings__Redis: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}
          Sample__KeyPrefix: 'respire:ci:aspnet:'
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          set -euo pipefail
          dotnet samples/Respire.Samples.AspNetCore/bin/Release/${{ matrix.framework }}/Respire.Samples.AspNetCore.dll \
            --urls http://127.0.0.1:0 > aspnet-sample.log 2>&1 &
          sample_pid=$!
          cleanup() { kill "$sample_pid" 2>/dev/null || true; wait "$sample_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=false
          for attempt in {1..60}; do
            base_url=$(sed -nE 's/.*Now listening on: (http:\/\/127\.0\.0\.1:[0-9]+).*/\1/p' aspnet-sample.log | head -n 1)
            if [[ -n "$base_url" ]] && curl --max-time 5 --fail --silent "$base_url/health" > /dev/null; then ready=true; break; fi
            kill -0 "$sample_pid" || { cat aspnet-sample.log; exit 1; }
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat aspnet-sample.log; exit 1; fi
          # An unrelated, older demonstration entry must not make a smoke run fail.
          curl --max-time 5 --fail --silent "$base_url/hybrid" > /dev/null
          # HybridCache can finish HTTP generation before its background L2 write reaches Redis.
          # PEXPIRE both observes the entry and expires it atomically, avoiding an EXISTS race.
          expired=false
          deadline=$((SECONDS + 15))
          while (( SECONDS < deadline )); do
            result=$(timeout 5s docker exec "$REDIS_CONTAINER" redis-cli PEXPIRE respire:ci:aspnet:cache:hybrid-time 1000)
            if [[ "$result" == 1 ]]; then expired=true; break; fi
            sleep 0.1
          done
          if [[ "$expired" != true ]]; then echo 'HybridCache entry did not reach Redis within 15 seconds.'; cat aspnet-sample.log; exit 1; fi
          pwsh -NoProfile -File samples/Respire.Samples.AspNetCore/Smoke.ps1 -BaseUrl "$base_url"
          pwsh -NoProfile -File samples/Respire.Samples.AspNetCore/Smoke.ps1 -BaseUrl "$base_url"
          # Each smoke waits six seconds for L1 expiry; the console metric exporter runs every second.
          grep -q 'Metric Name: db.client.operation.duration' aspnet-sample.log
          grep -q 'Activity.DisplayName:' aspnet-sample.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aspnet-sample-${{ matrix.framework }}
          path: aspnet-sample.log

  # The net10.0 suite runs as parallel jobs; "Build and Test (net10.0)" below gates on all of them.
  net10-unit:
    name: Unit Tests (net10.0, ${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The shards are disjoint and together cover every class except the telemetry suites,
        # which run isolated in the circuit-dispatch shard. Most of the suite's wall time is
        # [NotInParallel] tests, so the shards balance serial time rather than test count:
        # StandaloneCircuitDispatchTests alone holds about half of it.
        shard:
          - name: circuit-dispatch
            filter: '/*/*/StandaloneCircuitDispatchTests/*'
          - name: networking
            filter: '/*/Respire.Tests.Networking/(!StandaloneCircuitDispatchTests)/*'
          - name: core
            filter: '/*/(!Respire.Tests.Networking)/(!MetricSelectionTests)&(!ErrorMetricsTests)/*'
    env:
      RESPIRE_TEST_PROTOCOL: '3'
      DOCKER_HOST: unix:///var/run/docker.sock
      # Core tests own their listeners; the HTML reporter installs a process-wide listener.
      TUNIT_DISABLE_HTML_REPORTER: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet
        with:
          net8: 'false'

      - name: Build
        run: dotnet build tests/Respire.Tests -c Release -f net10.0 $TEST_BUILD_ARGS

      # A test that stops reporting progress for 10 minutes leaves a dump in the results directory.
      - name: Run Unit Tests
        run: >-
          dotnet run --project tests/Respire.Tests -c Release -f net10.0 --no-build --
          --treenode-filter '${{ matrix.shard.filter }}'
          --results-directory "$GITHUB_WORKSPACE/TestResults/unit"
          --report-trx --report-trx-filename unit-${{ matrix.shard.name }}.trx
          --hangdump --hangdump-timeout 10m
          $COVERAGE_ARGS

      # These tests control process-wide listener state; the HTML reporter adds its own listener.
      # The direct-path classes share one process: none of them adds an ActivityListener, and each
      # is [NotInParallel]. The metric suites assert on process-wide meter state, so they keep their own process.
      - name: Run telemetry and direct-path regressions without external tracing
        if: matrix.shard.name == 'circuit-dispatch'
        run: |
          dotnet run --project tests/Respire.Tests -c Release -f net10.0 --no-build -- \
            --treenode-filter '/*/*/(HedgedReadTests)|(BytesResponseTests)|(GetStringDirectPathTests)|(ClusterReadyReplyTests)/*'
          dotnet run --project tests/Respire.Tests -c Release -f net10.0 --no-build -- \
            --treenode-filter '/*/*/(MetricSelectionTests)|(ErrorMetricsTests)/*' \
            --results-directory "$GITHUB_WORKSPACE/TestResults/isolated-telemetry" \
            $COVERAGE_ARGS

      - name: List slowest tests
        if: always()
        uses: ./.github/actions/slowest-tests
        with:
          results-directory: TestResults/unit

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hangdump-net10.0-unit-${{ matrix.shard.name }}
          path: TestResults/unit/**/*.dmp
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && env.COLLECT_COVERAGE == 'true'
        with:
          name: coverage-net10.0-unit-${{ matrix.shard.name }}
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 1

  net10-integration:
    name: Integration Tests (net10.0, RESP3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESPIRE_TEST_PROTOCOL: '3'
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet
        with:
          net8: 'false'

      - name: Pre-pull Redis and Valkey images
        uses: ./.github/actions/prepull-images
        with:
          images: ${{ env.INTEGRATION_IMAGES }}

      - name: Build
        run: dotnet build tests/Respire.IntegrationTests -c Release -f net10.0 $TEST_BUILD_ARGS

      - name: Run Integration Tests
        run: >-
          dotnet run --project tests/Respire.IntegrationTests -c Release -f net10.0 --no-build --
          --results-directory "$GITHUB_WORKSPACE/TestResults/integration"
          --report-trx --report-trx-filename integration.trx
          --hangdump --hangdump-timeout 10m

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hangdump-net10.0-integration-resp3
          path: TestResults/integration/**/*.dmp
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify typed cluster replies during slot migration without external tracing
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: >-
          dotnet run --project tests/Respire.IntegrationTests -c Release -f net10.0 --no-build --
          --treenode-filter '/*/*/ClusterReadyReplyIntegrationTests/*' --minimum-expected-tests 12
          --report-trx --results-directory TestResults/cluster-ready

      - name: List slowest tests
        if: always()
        uses: ./.github/actions/slowest-tests
        with:
          results-directory: TestResults/integration

      - name: Upload TUnit HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tunit-reports-net10.0-integration
          path: '**/TestResults/**/*-report.html'
          retention-days: 14

  net10-components:
    name: Component Tests (net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESPIRE_TEST_PROTOCOL: '3'
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet
        with:
          net8: 'false'

      - name: Pre-pull Redis and Valkey images
        uses: ./.github/actions/prepull-images
        with:
          images: ${{ env.COMPONENT_IMAGES }}

      # One solution-filter build lets MSBuild compile independent projects in parallel.
      - name: Build
        run: dotnet build .github/ci/net10-components.slnf -c Release -f net10.0 $TEST_BUILD_ARGS

      # The suites are independent processes with their own containers, so they run concurrently.
      # Each one's output is printed as a group once all of them finish.
      - name: Run component tests
        run: |
          source .github/ci/parallel-suites.sh
          results="$GITHUB_WORKSPACE/TestResults/components"
          tests() {
            local project=$1 report=$2
            shift 2
            dotnet run --project "tests/$project" -c Release -f net10.0 --no-build -- \
              --results-directory "$results" --report-trx --report-trx-filename "$report.trx" "$@"
          }
          # Longest first, so the slowest suites start before the pool fills.
          suite caching tests Respire.Caching.Tests Respire.Caching.Tests
          suite coordination tests Respire.Coordination.Tests Respire.Coordination.Tests
          suite caching-redis-7.4 RESPIRE_TEST_REDIS_IMAGE=redis:7.4.11-alpine \
            tests Respire.Caching.Tests Respire.Caching.Tests-redis7.4 \
            --report-html-filename "$results/Respire.Caching.Tests-redis7.4-linux-net10.0-report.html"
          suite caching-hybrid tests Respire.Caching.Hybrid.Tests Respire.Caching.Hybrid.Tests
          suite fusioncache tests Respire.FusionCache.Tests Respire.FusionCache.Tests
          suite streaming TUNIT_DISABLE_HTML_REPORTER=true \
            tests Respire.Streaming.Tests Respire.Streaming.Tests --minimum-expected-tests 42
          suite streaming-dashboard TUNIT_DISABLE_HTML_REPORTER=true \
            tests Respire.Streaming.Dashboard.Tests Respire.Streaming.Dashboard.Tests --minimum-expected-tests 25
          suite signalr TUNIT_DISABLE_HTML_REPORTER=true \
            tests Respire.SignalR.Tests Respire.SignalR.Tests --minimum-expected-tests "$(cat .github/signalr-minimum-tests.txt)"
          suite aspire-client TUNIT_DISABLE_HTML_REPORTER=true \
            tests Aspire.Respire.Tests Aspire.Respire.Tests --minimum-expected-tests 25
          suite health-checks tests Respire.HealthChecks.Tests Respire.HealthChecks.Tests
          suite resilience tests Respire.Resilience.Tests Respire.Resilience.Tests
          suite azure tests Respire.Azure.Tests Respire.Azure.Tests
          suite data-protection tests Respire.DataProtection.Tests Respire.DataProtection.Tests
          finish_suites

      - name: List slowest tests
        if: always()
        uses: ./.github/actions/slowest-tests
        with:
          results-directory: TestResults/components

      - name: Run samples
        uses: ./.github/actions/run-samples
        with:
          framework: net10.0

      - name: Upload TUnit HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tunit-reports-net10.0
          path: '**/TestResults/**/*-report.html'
          retention-days: 14

  net10-analyzers:
    # Analyzer tests need no containers, so they run beside the component job instead of inside it.
    name: Analyzer Tests (net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet
        with:
          net8: 'false'

      - name: Build
        run: dotnet build tests/Respire.Analyzers.Tests -c Release -f net10.0 $TEST_BUILD_ARGS

      - name: Run Analyzer Tests
        run: >-
          dotnet run --project tests/Respire.Analyzers.Tests -c Release -f net10.0 --no-build --
          --results-directory "$GITHUB_WORKSPACE/TestResults/analyzers"
          --report-trx --report-trx-filename analyzers.trx

      - name: List slowest tests
        if: always()
        uses: ./.github/actions/slowest-tests
        with:
          results-directory: TestResults/analyzers

      - name: Upload TUnit HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tunit-reports-net10.0-analyzers
          path: '**/TestResults/**/*-report.html'
          retention-days: 14

  build-and-test-net10:
    # The name is a required status check. It passes only when every net10.0 job passed,
    # and on main it merges their coverage into one report.
    name: Build and Test (net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [net10-unit, net10-integration, net10-components, net10-analyzers, public-api-lifecycle]
    if: always()

    steps:
      - name: Require every net10.0 job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "net10.0 job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done

      # Pull requests collect no coverage, so the rest of this job runs only on main and manual runs.
      - name: Checkout code
        if: env.COLLECT_COVERAGE == 'true'
        uses: actions/checkout@v7

      - name: Set up .NET
        if: env.COLLECT_COVERAGE == 'true'
        uses: ./.github/actions/setup-dotnet
        with:
          net8: 'false'

      - name: Download coverage
        if: env.COLLECT_COVERAGE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-net10.0-*
          path: TestResults

      - name: Generate Code Coverage Report
        if: env.COLLECT_COVERAGE == 'true'
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -assemblyfilters:"-*Tests*;-*Benchmarks*;-*Samples*;-*Pipeline*" \
            -reporttypes:"Html;JsonSummary;MarkdownSummaryGithub;Cobertura"
          if [ -f CoverageReport/SummaryGithub.md ]; then
            cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: env.COLLECT_COVERAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: CoverageReport/
          retention-days: 30

      - name: Upload coverage to Codecov
        if: env.COLLECT_COVERAGE == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: CoverageReport/Cobertura.xml
          flags: unittests
          name: unit-tests
          fail_ci_if_error: false

  integration-tests-resp2:
    name: Integration Tests (net10.0, RESP2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESPIRE_TEST_PROTOCOL: '2'
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet
        with:
          net8: 'false'

      - name: Pre-pull Redis and Valkey images
        uses: ./.github/actions/prepull-images
        with:
          images: ${{ env.INTEGRATION_IMAGES }}

      - name: Build
        run: dotnet build tests/Respire.IntegrationTests -c Release -f net10.0 $TEST_BUILD_ARGS

      # Classes tagged ProtocolIndependent pin their protocol or never read RESPIRE_TEST_PROTOCOL,
      # so the RESP3 job already covers them.
      - name: Run Integration Tests
        run: >-
          dotnet run --project tests/Respire.IntegrationTests -c Release -f net10.0 --no-build --
          --treenode-filter '/*/*/*/*[Category!=ProtocolIndependent]'
          --hangdump --hangdump-timeout 10m

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hangdump-net10.0-integration-resp2
          path: '**/TestResults/**/*.dmp'
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload TUnit HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tunit-reports-net10.0-resp2
          path: '**/TestResults/*-report.html'
          retention-days: 14

  net8-smoke:
    name: Smoke Tests (net8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Pre-pull Redis and Valkey images
        uses: ./.github/actions/prepull-images
        with:
          images: ${{ env.NET8_IMAGES }}

      # One solution-filter build lets MSBuild compile independent projects in parallel.
      - name: Build
        run: dotnet build .github/ci/net8-smoke.slnf -c Release -f net8.0 $TEST_BUILD_ARGS

      # Each project runs in its own process, concurrently with the others. Respire.Tests runs its
      # filters one after another in a single lane, because each process needs different listener state.
      - name: Run smoke and regression tests
        run: |
          source .github/ci/parallel-suites.sh
          tests() {
            local project=$1
            shift
            dotnet run --project "tests/$project" -c Release -f net8.0 --no-build -- "$@"
          }
          core_tests() {
            local status=0
            # Utf8StringTests and TlsTests cover the code behind #if NET9_0_OR_GREATER / NET10_0_OR_GREATER;
            # FakeServerTests and ConnectionStringParsingTests exercise the client end to end.
            tests Respire.Tests \
              --treenode-filter '/*/*/(Utf8StringTests)|(TlsTests)|(FakeServerTests)|(ConnectionStringParsingTests)/*' || status=1
            export TUNIT_DISABLE_HTML_REPORTER=true
            # Standalone replica dispatch, command retry metadata, command write outcomes and gathered
            # SET ownership share one process. The minimum is the sum of the four suites' minimums.
            replica="$(cat .github/standalone-replica-filter.txt)"
            tests Respire.Tests \
              --treenode-filter "${replica%/\*}|(CommandCatalogTests)|(RetryCategoryMetadataTests)|(ClientCacheCommandMetadataTests)|(CommandWriteOutcomeTests)|(GatheredSetTests)/*" \
              --minimum-expected-tests "$(( $(cat .github/standalone-replica-minimum-tests.txt) + $(cat .github/command-retry-metadata-minimum-tests.txt) + 35 + 33 ))" \
              --report-trx --results-directory "$GITHUB_WORKSPACE/net8-regressions" || status=1
            # Binary GET source selection and the telemetry suites each need a process without
            # operation tracing.
            tests Respire.Tests --treenode-filter '/*/*/BytesResponseTests/*' || status=1
            tests Respire.Tests \
              --treenode-filter '/*/*/(MetricSelectionTests)|(ErrorMetricsTests)|(TelemetryTests)|(RedisMetricSchemaTests)|(ClusterReadyReplyTests)/*' || status=1
            return $status
          }
          suite respire-tests core_tests
          suite signalr TUNIT_DISABLE_HTML_REPORTER=true \
            tests Respire.SignalR.Tests --minimum-expected-tests "$(cat .github/signalr-minimum-tests.txt)"
          suite streaming TUNIT_DISABLE_HTML_REPORTER=true tests Respire.Streaming.Tests --minimum-expected-tests 42
          suite streaming-dashboard TUNIT_DISABLE_HTML_REPORTER=true tests Respire.Streaming.Dashboard.Tests --minimum-expected-tests 25
          suite fusioncache-leases TUNIT_DISABLE_HTML_REPORTER=true \
            tests Respire.FusionCache.Tests \
            --treenode-filter '/*/*/(DistributedLockerTests)|(DistributedLockerWireTests)|(DistributedLockerRegistrationTests)|(IndependentLeaseLifetimeTests)|(IndependentLeaseLifetimeWireTests)/*' \
            --minimum-expected-tests 28
          suite aspire-client TUNIT_DISABLE_HTML_REPORTER=true tests Aspire.Respire.Tests --minimum-expected-tests 25
          finish_suites

      - name: Upload net8.0 regression reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: net8-regressions
          path: net8-regressions/
          retention-days: 14

      - name: Run samples
        uses: ./.github/actions/run-samples
        with:
          framework: net8.0

      - name: Upload TUnit HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tunit-reports-net8.0
          path: '**/TestResults/*-report.html'
          retention-days: 14

  net8-debug-invariants:
    # Debug builds enable the publication guards these suites assert, so they need their own build.
    name: Debug Invariants (net8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TUNIT_DISABLE_HTML_REPORTER: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build
        run: dotnet build tests/Respire.Tests -c Debug -f net8.0 $TEST_BUILD_ARGS

      # Reserved writer invariants, aggregate progress and parser ownership share one process.
      # The minimum is the writer minimum plus the 42 aggregate progress tests.
      - name: Verify reserved writer invariants, aggregate progress and ownership (net8.0)
        run: |
          writer="$(cat .github/writer-invariants-filter.txt)"
          dotnet tests/Respire.Tests/bin/Debug/net8.0/Respire.Tests.dll \
            --treenode-filter "${writer%/\*}|(AggregateProgressTransferTests)|(AggregateProgressWireTests)|(AggregatePayloadTests)|(AggregateStorageTests)|(RespParseStateTests)|(RespParserTests)|(ParserContextTests)/*" \
            --minimum-expected-tests "$(( $(cat .github/writer-invariants-minimum.txt) + 42 ))" \
            --report-trx --results-directory "$GITHUB_WORKSPACE/writer-invariants-net8.0"

      - name: Upload net8.0 writer invariant results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: writer-invariants-net8.0
          path: writer-invariants-net8.0/

  build-and-test-net8:
    # The name is a required status check. It passes only when every net8.0 job passed;
    # net8.0 is a smoke run, and net10.0 carries the full suite.
    name: Build and Test (net8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [net8-smoke, net8-debug-invariants, public-api-lifecycle]
    if: always()

    steps:
      - name: Require every net8.0 job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "net8.0 job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done

  performance-validation:
    name: Performance Validation
    runs-on: ubuntu-latest
    needs: build-and-test-net10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Run Performance Benchmarks
        run: |
          cd benchmarks/Respire.Benchmarks
          timeout 10m dotnet run -c Release -f net10.0 -- \
            --filter "*Get*" \
            --exporters json markdown \
            --artifacts ./PerformanceResults \
            --memory-randomization false \
            --max-relative-error 0.05 \
            --iterationCount 10 || true

      - name: Analyze Performance Results
        run: |
          echo "## 🚀 Performance Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESULTS_DIR="benchmarks/Respire.Benchmarks/PerformanceResults/results"
          if [ -d "$RESULTS_DIR" ]; then
            for file in "$RESULTS_DIR"/*.md; do
              if [ -f "$file" ]; then
                echo "### 📈 GET Operation Performance" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY

                if grep -q "Mean" "$file"; then
                  echo "#### Key Performance Metrics:" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  grep -E "(Method|Mean|Error|StdDev|Allocated)" "$file" | head -15 >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                fi

                echo "" >> $GITHUB_STEP_SUMMARY
                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary>📄 Full Performance Report</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat "$file" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
                break
              fi
            done
          else
            echo "⚠️ Performance benchmarks timed out or failed" >> $GITHUB_STEP_SUMMARY
            echo "This is expected for quick CI runs - detailed performance testing" >> $GITHUB_STEP_SUMMARY
            echo "should be done in dedicated benchmark workflows." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Performance Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-validation
          path: benchmarks/Respire.Benchmarks/PerformanceResults/
          retention-days: 7
