name: CI

# The single PR test workflow. Each job builds only the projects it runs, for one framework;
# the Modular Pipeline workflow compiles the whole solution for every framework and verifies the packages.
#   - net10.0 runs the full suite (RESP3). A second job reruns Respire.IntegrationTests on RESP2 so the
#     shared typed scenarios parse both reply shapes; tests that pin a protocol already cover the
#     other suites' protocol-specific behavior, so those suites run once.
#   - net8.0 runs a smoke set: the framework-conditional code paths, the fake-server
#     client path, and the public samples, including one against a real Redis container.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

concurrency:
  # A newer commit on the same PR or branch supersedes older runs. Every main commit still runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  mapper-native-aot:
    name: Generated mapper Native AOT (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    services:
      redis:
        image: redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet
      - name: Record SDK and runtime toolchain
        run: dotnet --info
      - name: Publish trimmed Native AOT mapper sample
        run: >-
          dotnet publish samples/Respire.Samples.Mappers -c Release -f ${{ matrix.framework }}
          -r linux-x64 -o artifacts/mapper-aot/${{ matrix.framework }}
      - name: Execute hash, JSON and Search conformance with RESP2 and RESP3
        run: >-
          artifacts/mapper-aot/${{ matrix.framework }}/Respire.Samples.Mappers
          redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}

  benchmark-policy:
    name: Benchmark label cancellation policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify policy and rejection controls
        run: |
          python scripts/workflows/BenchmarkWorkflowPolicyTests.py
          python scripts/workflows/BenchmarkRetentionTests.py
          python scripts/workflows/BenchmarkProfileTests.py
          python -B -m unittest discover -s scripts/benchmarks -p '*Tests.py'
          python scripts/workflows/BenchmarkWorkflowPolicy.py

  aspire-integration:
    name: Aspire Redis and Valkey integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUNIT_DISABLE_HTML_REPORTER: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet
      - name: Build .NET 10 Aspire sample and test host
        run: |
          dotnet build samples/Respire.Samples.Aspire.AppHost -c Release -f net10.0
          dotnet build tests/Aspire.Respire.IntegrationTests -c Release -f net10.0
      - name: Verify injected clients and HTTP caches
        run: >-
          dotnet run --project tests/Aspire.Respire.IntegrationTests -c Release --no-build --
          --minimum-expected-tests 1 --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults/aspire"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aspire-integration
          path: TestResults/aspire

  aspnet-sample:
    name: ASP.NET Core sample (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    services:
      redis:
        image: redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet
      - name: Build sample
        run: dotnet build samples/Respire.Samples.AspNetCore -c Release -f ${{ matrix.framework }}
      - name: Verify HTTP caches against Redis
        shell: bash
        env:
          ConnectionStrings__Redis: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}
          Sample__KeyPrefix: 'respire:ci:aspnet:'
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          set -euo pipefail
          dotnet samples/Respire.Samples.AspNetCore/bin/Release/${{ matrix.framework }}/Respire.Samples.AspNetCore.dll \
            --urls http://127.0.0.1:0 > aspnet-sample.log 2>&1 &
          sample_pid=$!
          cleanup() { kill "$sample_pid" 2>/dev/null || true; wait "$sample_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=false
          for attempt in {1..60}; do
            base_url=$(sed -nE 's/.*Now listening on: (http:\/\/127\.0\.0\.1:[0-9]+).*/\1/p' aspnet-sample.log | head -n 1)
            if [[ -n "$base_url" ]] && curl --max-time 5 --fail --silent "$base_url/health" > /dev/null; then ready=true; break; fi
            kill -0 "$sample_pid" || { cat aspnet-sample.log; exit 1; }
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat aspnet-sample.log; exit 1; fi
          # An unrelated, older demonstration entry must not make a smoke run fail.
          curl --max-time 5 --fail --silent "$base_url/hybrid" > /dev/null
          # HybridCache can finish HTTP generation before its background L2 write reaches Redis.
          # PEXPIRE both observes the entry and expires it atomically, avoiding an EXISTS race.
          expired=false
          deadline=$((SECONDS + 15))
          while (( SECONDS < deadline )); do
            result=$(timeout 5s docker exec "$REDIS_CONTAINER" redis-cli PEXPIRE respire:ci:aspnet:cache:hybrid-time 1000)
            if [[ "$result" == 1 ]]; then expired=true; break; fi
            sleep 0.1
          done
          if [[ "$expired" != true ]]; then echo 'HybridCache entry did not reach Redis within 15 seconds.'; cat aspnet-sample.log; exit 1; fi
          pwsh -NoProfile -File samples/Respire.Samples.AspNetCore/Smoke.ps1 -BaseUrl "$base_url"
          pwsh -NoProfile -File samples/Respire.Samples.AspNetCore/Smoke.ps1 -BaseUrl "$base_url"
          # Each smoke waits six seconds for L1 expiry; the console metric exporter runs every second.
          grep -q 'Metric Name: db.client.operation.duration' aspnet-sample.log
          grep -q 'Activity.DisplayName:' aspnet-sample.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aspnet-sample-${{ matrix.framework }}
          path: aspnet-sample.log

  build-and-test-net10:
    # The name is a required status check.
    name: Build and Test (net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESPIRE_TEST_PROTOCOL: '3'
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build
        run: |
          for project in \
            tests/Aspire.Respire.Tests \
            tests/Respire.Tests \
            tests/Respire.HealthChecks.Tests \
            tests/Respire.Analyzers.Tests \
            tests/Respire.IntegrationTests \
            tests/Respire.Coordination.Tests \
            tests/Respire.Azure.Tests \
            tests/Respire.DataProtection.Tests \
            tests/Respire.Caching.Tests \
            tests/Respire.Caching.Hybrid.Tests \
            tests/Respire.FusionCache.Tests \
            tests/Respire.SignalR.Tests \
            tests/Respire.Streaming.Tests \
            samples/Respire.Samples.Testing \
            samples/Respire.Samples.Cluster \
            samples/Respire.Samples.Sentinel \
            samples/Respire.Samples.Azure
          do
            dotnet build "$project" -c Release -f net10.0
          done

      - name: Run Unit Tests
        env:
          # Core tests own their listeners; the HTML reporter installs a process-wide listener.
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: |
          dotnet run --project tests/Respire.Tests -c Release -f net10.0 --no-build -- \
            --treenode-filter '/*/*/(!MetricSelectionTests)&(!ErrorMetricsTests)/*' \
            --results-directory "$GITHUB_WORKSPACE/TestResults" \
            --coverage \
            --coverage-output coverage.cobertura.xml \
            --coverage-output-format cobertura

      # These tests control process-wide listener state; the HTML reporter adds its own listener.
      - name: Run telemetry and direct-path regressions without external tracing
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: |
          dotnet run --project tests/Respire.Tests -c Release -f net10.0 --no-build -- \
            --treenode-filter '/*/*/(HedgedReadTests)|(BytesResponseTests)/*'
          dotnet run --project tests/Respire.Tests -c Release -f net10.0 --no-build -- \
            --treenode-filter '/*/*/(GetStringDirectPathTests)|(ClusterReadyReplyTests)/*'
          dotnet run --project tests/Respire.Tests -c Release -f net10.0 --no-build -- \
            --treenode-filter '/*/*/(MetricSelectionTests)|(ErrorMetricsTests)/*' \
            --results-directory "$GITHUB_WORKSPACE/TestResults/isolated-telemetry" \
            --coverage \
            --coverage-output coverage.cobertura.xml \
            --coverage-output-format cobertura

      - name: Run Health Check Tests
        run: dotnet run --project tests/Respire.HealthChecks.Tests -c Release -f net10.0 --no-build

      - name: Run Aspire Client Tests
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: dotnet run --project tests/Aspire.Respire.Tests -c Release -f net10.0 --no-build -- --minimum-expected-tests 25

      - name: Run Analyzer Tests
        run: dotnet run --project tests/Respire.Analyzers.Tests -c Release -f net10.0 --no-build

      - name: Run Integration Tests
        run: dotnet run --project tests/Respire.IntegrationTests -c Release -f net10.0 --no-build

      - name: Verify typed cluster replies during slot migration without external tracing
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: >-
          dotnet run --project tests/Respire.IntegrationTests -c Release -f net10.0 --no-build --
          --treenode-filter '/*/*/ClusterReadyReplyIntegrationTests/*' --minimum-expected-tests 12
          --report-trx --results-directory TestResults/cluster-ready

      - name: Run Coordination Tests
        run: dotnet run --project tests/Respire.Coordination.Tests -c Release -f net10.0 --no-build

      - name: Run Azure Integration Tests
        run: dotnet run --project tests/Respire.Azure.Tests -c Release -f net10.0 --no-build

      - name: Run DataProtection Tests
        run: dotnet run --project tests/Respire.DataProtection.Tests -c Release -f net10.0 --no-build

      - name: Run Caching Tests
        run: |
          dotnet run --project tests/Respire.Caching.Tests -c Release -f net10.0 --no-build
          dotnet run --project tests/Respire.Caching.Hybrid.Tests -c Release -f net10.0 --no-build
          dotnet run --project tests/Respire.FusionCache.Tests -c Release -f net10.0 --no-build

      - name: Run SignalR backplane tests
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: dotnet run --project tests/Respire.SignalR.Tests -c Release -f net10.0 --no-build -- --minimum-expected-tests "$(cat .github/signalr-minimum-tests.txt)"

      - name: Run stream worker tests
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: dotnet run --project tests/Respire.Streaming.Tests -c Release -f net10.0 --no-build -- --minimum-expected-tests 42

      - name: Run Caching Tests on Redis 7.4
        env:
          RESPIRE_TEST_REDIS_IMAGE: redis:7.4.11-alpine
        run: >-
          dotnet run --project tests/Respire.Caching.Tests -c Release -f net10.0 --no-build --
          --report-html-filename TestResults/Respire.Caching.Tests-redis7.4-linux-net10.0-report.html

      - name: Run samples
        uses: ./.github/actions/run-samples
        with:
          framework: net10.0

      - name: Generate Code Coverage Report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -assemblyfilters:"-*Tests*;-*Benchmarks*;-*Samples*;-*Pipeline*" \
            -reporttypes:"Html;JsonSummary;MarkdownSummaryGithub;Cobertura"
          if [ -f CoverageReport/SummaryGithub.md ]; then
            cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload TUnit HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tunit-reports-net10.0
          path: '**/TestResults/*-report.html'
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: CoverageReport/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: CoverageReport/Cobertura.xml
          flags: unittests
          name: unit-tests
          fail_ci_if_error: false

  integration-tests-resp2:
    name: Integration Tests (net10.0, RESP2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESPIRE_TEST_PROTOCOL: '2'
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build
        run: dotnet build tests/Respire.IntegrationTests -c Release -f net10.0

      # Classes tagged ProtocolIndependent pin their protocol or never read RESPIRE_TEST_PROTOCOL,
      # so the RESP3 job already covers them.
      - name: Run Integration Tests
        run: >-
          dotnet run --project tests/Respire.IntegrationTests -c Release -f net10.0 --no-build --
          --treenode-filter '/*/*/*/*[Category!=ProtocolIndependent]'

      - name: Upload TUnit HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tunit-reports-net10.0-resp2
          path: '**/TestResults/*-report.html'
          retention-days: 14

  build-and-test-net8:
    # The name is a required status check. This job is a smoke run; net10.0 carries the full suite.
    name: Build and Test (net8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Repository tooling checks need no .NET build; they ride along in the lightest job.
      - name: Verify command catalog generation
        shell: pwsh
        run: ./scripts/Test-CommandCatalog.ps1

      - name: Run Python probe regression tests
        run: python3 -m unittest discover -s scripts/probes -v

      - name: Verify worktree cleanup safety
        shell: pwsh
        run: |
          foreach ($test in @('Test-MergedWorktreeSweep', 'Test-WorktreeCleanup', 'Test-WorkflowArtifactCleanup', 'Test-MergePr', 'Test-MergePrLifecycle', 'Test-ReleasedWorktreeCleanup')) {
            & pwsh -NoProfile -File "./scripts/$test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build
        run: |
          for project in \
            tests/Aspire.Respire.Tests \
            tests/Respire.Tests \
            tests/Respire.FusionCache.Tests \
            tests/Respire.SignalR.Tests \
            tests/Respire.Streaming.Tests \
            samples/Respire.Samples.Testing \
            samples/Respire.Samples.Cluster \
            samples/Respire.Samples.Sentinel \
            samples/Respire.Samples.Azure
          do
            dotnet build "$project" -c Release -f net8.0
          done

      - name: Run Aspire Client Tests
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: dotnet run --project tests/Aspire.Respire.Tests -c Release -f net8.0 --no-build -- --minimum-expected-tests 25

      # Utf8StringTests and TlsTests cover the code behind #if NET9_0_OR_GREATER / NET10_0_OR_GREATER;
      # FakeServerTests and ConnectionStringParsingTests exercise the client end to end.
      - name: Run unit smoke tests
        run: |
          dotnet run --project tests/Respire.Tests -c Release -f net8.0 --no-build -- \
            --treenode-filter '/*/*/(Utf8StringTests)|(TlsTests)|(FakeServerTests)|(ConnectionStringParsingTests)/*'

      - name: Verify standalone replica dispatch (net8.0)
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: >-
          dotnet run --project tests/Respire.Tests -c Release -f net8.0 --no-build --
          --treenode-filter "$(cat .github/standalone-replica-filter.txt)"
          --minimum-expected-tests "$(cat .github/standalone-replica-minimum-tests.txt)"
          --report-trx --results-directory standalone-replica-net8

      - name: Verify command retry metadata (net8.0)
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: >-
          dotnet run --project tests/Respire.Tests -c Release -f net8.0 --no-build --
          --treenode-filter '/*/*/(CommandCatalogTests)|(RetryCategoryMetadataTests)|(ClientCacheCommandMetadataTests)/*'
          --minimum-expected-tests "$(cat .github/command-retry-metadata-minimum-tests.txt)"

      - name: Verify command write outcomes (net8.0)
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: >-
          dotnet run --project tests/Respire.Tests -c Release -f net8.0 --no-build --
          --treenode-filter '/*/*/CommandWriteOutcomeTests/*'
          --minimum-expected-tests 35
          --report-trx --results-directory command-write-outcomes-net8

      - name: Upload command write outcome regressions (net8.0)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: command-write-outcomes-net8.0
          path: command-write-outcomes-net8/
          retention-days: 14

      - name: Verify gathered SET ownership (net8.0)
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: >-
          dotnet run --project tests/Respire.Tests -c Release -f net8.0 --no-build --
          --treenode-filter '/*/*/GatheredSetTests/*'
          --minimum-expected-tests 33

      - name: Upload standalone replica regression report (net8.0)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-replica-dispatch-net8.0
          path: standalone-replica-net8/
          retention-days: 14

      - name: Run SignalR backplane tests
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: dotnet run --project tests/Respire.SignalR.Tests -c Release -f net8.0 --no-build -- --minimum-expected-tests "$(cat .github/signalr-minimum-tests.txt)"

      - name: Run stream worker tests
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: dotnet run --project tests/Respire.Streaming.Tests -c Release -f net8.0 --no-build -- --minimum-expected-tests 42

      - name: Run FusionCache lease lifetime regressions
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: >-
          dotnet run --project tests/Respire.FusionCache.Tests -c Release -f net8.0 --no-build --
          --treenode-filter '/*/*/(DistributedLockerTests)|(DistributedLockerWireTests)|(DistributedLockerRegistrationTests)|(IndependentLeaseLifetimeTests)|(IndependentLeaseLifetimeWireTests)/*'
          --minimum-expected-tests 28

      - name: Run binary GET regressions without operation tracing
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: >-
          dotnet run --project tests/Respire.Tests -c Release -f net8.0 --no-build --
          --treenode-filter '/*/*/BytesResponseTests/*'

      - name: Run telemetry regressions without external tracing
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: |
          dotnet run --project tests/Respire.Tests -c Release -f net8.0 --no-build -- \
            --treenode-filter '/*/*/(MetricSelectionTests)|(ErrorMetricsTests)|(TelemetryTests)|(RedisMetricSchemaTests)|(ClusterReadyReplyTests)/*'

      - name: Verify aggregate progress and ownership (net8.0)
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: |
          dotnet build tests/Respire.Tests -c Debug -f net8.0
          dotnet tests/Respire.Tests/bin/Debug/net8.0/Respire.Tests.dll \
            --treenode-filter '/*/*/(AggregateProgressTransferTests)|(AggregateProgressWireTests)/*' \
            --minimum-expected-tests 42
          dotnet tests/Respire.Tests/bin/Debug/net8.0/Respire.Tests.dll \
            --treenode-filter '/*/*/(AggregatePayloadTests)|(AggregateStorageTests)|(RespParseStateTests)|(RespParserTests)|(ParserContextTests)/*'

      # Reuse the Debug core build above; net8 correctness stays in its designated CI job.
      - name: Verify reserved writer invariants (net8.0)
        env:
          TUNIT_DISABLE_HTML_REPORTER: 'true'
        run: >-
          dotnet run --project tests/Respire.Tests -c Debug -f net8.0 --no-build --
          --treenode-filter "$(cat .github/writer-invariants-filter.txt)"
          --minimum-expected-tests "$(cat .github/writer-invariants-minimum.txt)"
          --report-trx --results-directory writer-invariants-net8.0

      - name: Upload net8.0 writer invariant results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: writer-invariants-net8.0
          path: writer-invariants-net8.0/

      - name: Run samples
        uses: ./.github/actions/run-samples
        with:
          framework: net8.0

      - name: Upload TUnit HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tunit-reports-net8.0
          path: '**/TestResults/*-report.html'
          retention-days: 14

  performance-validation:
    name: Performance Validation
    runs-on: ubuntu-latest
    needs: build-and-test-net10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Run Performance Benchmarks
        run: |
          cd benchmarks/Respire.Benchmarks
          timeout 10m dotnet run -c Release -f net10.0 -- \
            --filter "*Get*" \
            --exporters json markdown \
            --artifacts ./PerformanceResults \
            --memory-randomization false \
            --max-relative-error 0.05 \
            --iterationCount 10 || true

      - name: Analyze Performance Results
        run: |
          echo "## 🚀 Performance Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESULTS_DIR="benchmarks/Respire.Benchmarks/PerformanceResults/results"
          if [ -d "$RESULTS_DIR" ]; then
            for file in "$RESULTS_DIR"/*.md; do
              if [ -f "$file" ]; then
                echo "### 📈 GET Operation Performance" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY

                if grep -q "Mean" "$file"; then
                  echo "#### Key Performance Metrics:" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  grep -E "(Method|Mean|Error|StdDev|Allocated)" "$file" | head -15 >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                fi

                echo "" >> $GITHUB_STEP_SUMMARY
                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary>📄 Full Performance Report</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat "$file" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
                break
              fi
            done
          else
            echo "⚠️ Performance benchmarks timed out or failed" >> $GITHUB_STEP_SUMMARY
            echo "This is expected for quick CI runs - detailed performance testing" >> $GITHUB_STEP_SUMMARY
            echo "should be done in dedicated benchmark workflows." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Performance Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-validation
          path: benchmarks/Respire.Benchmarks/PerformanceResults/
          retention-days: 7
