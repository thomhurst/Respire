name: Dedicated pool benchmarks

on:
  pull_request:
    types: [labeled]
    paths:
      - 'src/Respire/Internal/DedicatedConnectionPool*.cs'
      - 'benchmarks/Respire.Benchmarks/DedicatedPoolBenchmarks.cs'
      - '.github/workflows/benchmark-dedicated-pool.yml'

permissions:
  contents: read

concurrency:
  # Reapplying the benchmark label supersedes older runs on the same PR.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pool-comparison:
    if: github.event.label.name == 'run-benchmarks'
    name: Compare dedicated pool leases (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Compare pinned baseline, candidate, baseline on one runner
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/benchmarks/Respire.Benchmarks/DedicatedPoolBenchmarks.cs baseline/benchmarks/Respire.Benchmarks/
          for phase in validation baseline-a candidate baseline-b; do
            source=baseline
            job=Medium
            filter='*DedicatedPoolBenchmarks*'
            if [ "$phase" = candidate ] || [ "$phase" = validation ]; then source=candidate; fi
            if [ "$phase" = validation ]; then job=Dry; filter='*DedicatedPoolBenchmarks*'; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --filter "$filter" --job "$job" --exporters json markdown \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require completed measurements
        shell: python
        run: |
          import json
          from pathlib import Path
          for phase in ("validation", "baseline-a", "candidate", "baseline-b"):
              reports = list(Path("results", phase, "results").glob("*-report*.json"))
              assert reports, f"Missing benchmark results: {phase}"
              for report in reports:
                  benchmarks = json.loads(report.read_text())["Benchmarks"]
                  assert benchmarks, f"No benchmarks: {report}"
                  for benchmark in benchmarks:
                      statistics = benchmark.get("Statistics")
                      assert statistics and statistics["Mean"] > 0, f"Failed benchmark: {report}"
      - name: Publish comparison reports
        if: always()
        shell: bash
        run: |
          echo "Informational A/B/A lease timing, allocation, and contention evidence; no numeric threshold is enforced." >> "$GITHUB_STEP_SUMMARY"
          for phase in baseline-a candidate baseline-b; do
            echo "## $phase" >> "$GITHUB_STEP_SUMMARY"
            for report in "$GITHUB_WORKSPACE/results/$phase/results/"*-report-default.md; do
              if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dedicated-pool-comparison
          path: |
            results/
            *.log
