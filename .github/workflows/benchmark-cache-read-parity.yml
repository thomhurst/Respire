name: Client cache read parity benchmarks

# Keep fixture, filter, case count and allocation checks aligned with benchmark-cache-read.yml.
# The sibling requires a concurrent-hit speedup; this workflow measures correctness parity.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.label.name == 'run-cache-read-parity-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/ClientCacheReadBenchmarks.cs
      filter: '*ClientCacheReadBenchmarks*'
      expected-case-count: 6
      expected-methods: StringHit,ConcurrentStringHits,EvictAndReadMiss
      zero-allocation-methods: StringHit
      # Correctness changes need parity evidence rather than a required speedup.
      # The comparison retains both baseline controls and requires manual acceptance.
      artifact-prefix: cache-read-parity-comparison
