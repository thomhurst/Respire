name: Semaphore benchmarks

on:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - 'src/Respire.Extensions.Coordination/**'
      - 'src/Respire/RespireClient.cs'
      - 'benchmarks/Respire.Benchmarks/SemaphoreBenchmarks.cs'
      - '.github/workflows/benchmark-semaphores.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  semaphores:
    if: contains(github.event.pull_request.labels.*.name, 'run-benchmarks')
    name: Compare semaphores (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.10@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Run pinned baseline, candidate, baseline sequentially
        shell: bash
        run: |
          set -euo pipefail
          # Keep shared feature sources identical across phases so each revision builds.
          # The copied semaphore source compiles against baseline internals (for example
          # RespireLock.NewToken and the tracked-script types); the shims below add only the
          # client and telemetry members it needs. Remove these shims once the PR base contains
          # every API used by the candidate semaphore source. Baseline phases benchmark the standard lease,
          # which never runs the copied semaphore code, and keep the base client implementation.
          cp candidate/benchmarks/Respire.Benchmarks/SemaphoreBenchmarks.cs baseline/benchmarks/Respire.Benchmarks/
          cp candidate/src/Respire.Extensions.Coordination/RespireSemaphore.cs baseline/src/Respire.Extensions.Coordination/
          cp candidate/src/Respire/Internal/CoordinationCleanupRetry.cs baseline/src/Respire/Internal/
          python3 - <<'PY'
          from pathlib import Path

          path = Path('baseline/src/Respire/RespireClient.cs')
          source = path.read_text()
          correction_marker = '    internal async ValueTask<bool> TryEnsureReliableCorrectionOrderingAsync()\n'
          correction_shim = ('    internal async ValueTask<RespireClient?> GetCorrectionTrackingClientAsync(CancellationToken cancellationToken)\n'
                             '    {\n'
                             '        if (RequiresReliableCorrectionOrdering(cancellationToken))\n'
                             '        {\n'
                             '            await EnsureReliableCorrectionOrderingAsync(cancellationToken).ConfigureAwait(false);\n'
                             '            return this;\n'
                             '        }\n'
                             '        return await TryEnsureReliableCorrectionOrderingAsync().ConfigureAwait(false) ? this : null;\n'
                             '    }\n\n')
          correction_api = 'internal async ValueTask<RespireClient?> GetCorrectionTrackingClientAsync(CancellationToken cancellationToken)'
          if correction_api not in source:
              assert source.count(correction_marker) == 1
              source = source.replace(correction_marker, correction_shim + correction_marker, 1)
          assert source.count(correction_api) == 1
          marker = '    internal async ValueTask FenceCorrectionConnectionAsync(TrackedConnectionIdentity identity)\n'
          shim = ('    internal ValueTask FenceCorrectionConnectionAsync(TrackedConnectionIdentity identity, CancellationToken cancellationToken, Action? onAcknowledged)\n'
                  '        => FenceCorrectionConnectionAsync(identity);\n\n')
          fence_api = 'TrackedConnectionIdentity identity, CancellationToken cancellationToken, Action? onAcknowledged'
          if fence_api not in source:
              assert source.count(marker) == 1
              source = source.replace(marker, shim + marker, 1)
          assert source.count(fence_api) == 1
          tracked_marker = '    internal async ValueTask<TrackedScriptExecution> StartTrackedScriptExecutionAsync(\n'
          tracked_shim = ('    internal ValueTask<TrackedScriptExecution> StartTrackedScriptExecutionAsync(\n'
                          '        RespireScript script, RespireKey[] keys, RespireValue[] args,\n'
                          '        CancellationToken cancellationToken, bool requireReliableCorrectionOrdering,\n'
                          '        bool captureSendTimestampOnly, Action<long>? onSerialized = null, Action? onCommandNotApplied = null)\n'
                          '    {\n'
                          '        // The pinned baseline API has no serialization callback; invoke it immediately before its legacy send path.\n'
                          '        onSerialized?.Invoke(Stopwatch.GetTimestamp());\n'
                          '        return StartTrackedScriptExecutionAsync(script, keys, args, cancellationToken, requireReliableCorrectionOrdering);\n'
                          '    }\n\n')
          tracked_api = 'bool captureSendTimestampOnly = false,\n        Action<long>? onSerialized = null,\n        Action? onCommandNotApplied = null)'
          if tracked_api not in source:
              assert source.count(tracked_marker) == 1
              source = source.replace(tracked_marker, tracked_shim + tracked_marker, 1)
              tracked_shim_api = 'bool captureSendTimestampOnly, Action<long>? onSerialized = null, Action? onCommandNotApplied = null)'
              assert source.count(tracked_shim_api) == 1
          else:
              assert source.count(tracked_api) == 1
          assert source.count(fence_api) == 1
          path.write_text(source)

          # The copied semaphore uses the candidate cleanup queue, but baseline measurements
          # only exercise standard leases. Add a compile-only queue stub to the pinned baseline.
          core = Path('baseline/src/Respire/Internal/ClientCore.cs')
          core_source = core.read_text()
          core_marker = '    public readonly ClientSideCacheCoordinator? ClientCache;\n'
          core_shim = '    internal readonly CoordinationCleanupQueue CoordinationCleanupQueue = new();\n'
          if 'CoordinationCleanupQueue CoordinationCleanupQueue' not in core_source:
              assert core_source.count(core_marker) == 1
              core_source = core_source.replace(core_marker, core_marker + core_shim, 1)
              core.write_text(core_source)

          queue = Path('baseline/src/Respire/Internal/CoordinationCleanupQueue.BenchmarkShim.cs')
          if not queue.exists():
              queue.write_text('''using System;
          using System.Threading;
          using System.Threading.Tasks;

          namespace Respire.Internal;

          internal enum CleanupAttemptResult { Succeeded, Failed, Abandoned }

          internal sealed class CoordinationCleanupQueue
          {
              internal Task<bool> EnqueueAsync(
                  Func<CancellationToken, ValueTask<CleanupAttemptResult>> attempt,
                  Func<bool>? shouldContinue,
                  TimeSpan retryLimit,
                  TimeSpan initialDelay,
                  TimeSpan maximumDelay,
                  Action<string> onAbandoned) => Task.FromResult(false);
          }
          ''')

          # The copied semaphore reports abandoned cleanup through telemetry that this PR adds.
          # The baseline never runs semaphore cleanup, so a no-op stub is enough to compile.
          telemetry = Path('baseline/src/Respire/Internal/RespireTelemetry.cs')
          telemetry_source = telemetry.read_text()
          if 'RecordCoordinationCleanupAbandoned(' not in telemetry_source:
              telemetry_marker = 'internal static class RespireTelemetry\n{\n'
              telemetry_shim = ('    internal static void RecordCoordinationCleanupAbandoned(\n'
                                '        string primitive, string stage, string reason, ILogger? logger)\n'
                                '    {\n'
                                '    }\n\n')
              assert telemetry_source.count(telemetry_marker) == 1
              assert 'using Microsoft.Extensions.Logging;' in telemetry_source
              telemetry_source = telemetry_source.replace(telemetry_marker, telemetry_marker + telemetry_shim, 1)
              telemetry.write_text(telemetry_source)
          PY
          for phase in validation baseline-a candidate baseline-b; do
            source=baseline
            job=Medium
            export RESPIRE_BENCH_BASELINE=1
            if [ "$phase" = candidate ] || [ "$phase" = validation ]; then
              source=candidate
              export RESPIRE_BENCH_BASELINE=0
            fi
            if [ "$phase" = validation ]; then job=Dry; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --filter '*SemaphoreBenchmarks*' --job "$job" --exporters json markdown \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Verify and summarize results
        shell: python
        run: |
          import json, os
          from pathlib import Path
          phases = {}
          for phase in ('validation', 'baseline-a', 'candidate', 'baseline-b'):
              reports = list(Path('results', phase, 'results').glob('*-report-full-compressed.json'))
              assert len(reports) == 1, f'Missing report: {phase}'
              cases = json.loads(reports[0].read_text())['Benchmarks']
              expected = 2 if phase in ('validation', 'candidate') else 1
              assert len(cases) == expected, f'Unexpected cases: {phase}'
              phases[phase] = {case['Parameters']: case for case in cases}
              assert all(case.get('Statistics') and case['Statistics']['Mean'] > 0 for case in cases)
          lines = ['## Acquire and release one uncontended permit', '',
                   'Standard leases are compared across pinned A/B/A builds. Semaphore permits are reported separately.', '',
                   '| Phase | Mode | Mean ns | Operations/s | Allocated B |', '| --- | --- | ---: | ---: | ---: |']
          metrics = []
          for phase in ('baseline-a', 'candidate', 'baseline-b'):
              for mode, case in phases[phase].items():
                  mean = case['Statistics']['Mean']
                  allocation = case['Memory']['BytesAllocatedPerOperation']
                  lines.append(f'| {phase} | {mode} | {mean:.3f} | {1e9/mean:.3f} | {allocation} |')
              records = [json.loads(line.split(' ', 1)[1]) for line in Path(f'{phase}.log').read_text().splitlines()
                         if line.startswith('SEMAPHORE_PROCESS_METRICS ')]
              expected_modes = {False, True} if phase == 'candidate' else {False}
              assert {record['Semaphore'] for record in records} == expected_modes
              assert all(record['operations'] > 0 and record['cpuMilliseconds'] >= 0 for record in records)
              metrics.extend(dict(record, phase=phase) for record in records)
          standard = 'Semaphore=False'
          a, candidate, b = [phases[phase][standard] for phase in ('baseline-a', 'candidate', 'baseline-b')]
          am, cm, bm = [case['Statistics']['Mean'] for case in (a, candidate, b)]
          lines += ['', f'Standard lease deltas: candidate/A {(cm/am-1)*100:+.2f}%; candidate/B {(cm/bm-1)*100:+.2f}%; control drift {(bm/am-1)*100:+.2f}%.',
                    '', 'Baseline phases run the base revision client plus compatibility shims that let the copied semaphore source compile; the shims are not on the measured path.',
                    '', 'Process CPU includes warmup, calibration and background work. Raw launch measurements remain in the JSON artifacts.']
          report = '\n'.join(lines) + '\n'
          Path('results/comparison.md').write_text(report)
          Path('results/process-metrics.json').write_text(json.dumps(metrics, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output: output.write(report)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semaphore-comparison
          path: |
            results/
            *.log
