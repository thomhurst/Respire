name: Argument formatting benchmarks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.label.name == 'run-argument-formatting-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/ArgumentFormattingBenchmarks.cs
      filter: '*ArgumentFormattingBenchmarks*'
      expected-case-count: 6
      expected-methods: Utf16Key,Utf8Key,Utf16Value,Utf8Value,SerializeValue,ValueEquals
      zero-allocation-methods: Utf16Key,Utf8Key,Utf16Value,Utf8Value,SerializeValue,ValueEquals
      artifact-prefix: argument-formatting-comparison
