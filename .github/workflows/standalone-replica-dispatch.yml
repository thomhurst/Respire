name: Standalone replica dispatch regressions

on:
  pull_request:
    # Drafts skip every job before a runner starts; marking the PR ready runs them on the reviewed head.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'src/Respire/RespireClient*.cs'
      - 'src/Respire/Internal/ReadEndpointRouter*.cs'
      - 'src/Respire/Internal/ReplicaHealth.cs'
      - 'tests/Respire.Tests/Networking/StandaloneReplicaReadyTests.cs'
      - '.github/standalone-replica-filter.txt'
      - '.github/standalone-replica-minimum-tests.txt'
      - '.github/workflows/standalone-replica-dispatch.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # CI covers both frameworks on Linux: its net8.0 job runs this filter with its minimum, and its
  # net10.0 unit shards run every class in it in Release without the HTML reporter. This job adds
  # Windows scheduling and tiered compilation for the same cases.
  routing:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Standalone replica dispatch (${{ matrix.os }}, net10.0)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    env:
      TUNIT_DISABLE_HTML_REPORTER: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Verify routing policies, publications, reply ownership and allocation controls
        shell: pwsh
        run: >-
          dotnet run --project tests/Respire.Tests -c Release -f net10.0 --
          --treenode-filter (Get-Content .github/standalone-replica-filter.txt -Raw).Trim()
          --minimum-expected-tests (Get-Content .github/standalone-replica-minimum-tests.txt -Raw).Trim()
          --report-trx --results-directory standalone-replica
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: standalone-replica-${{ matrix.os }}-net10.0
          path: standalone-replica/
