name: Respire vs StackExchange.Redis Benchmarks

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'benchmarks/Respire.ComparisonBenchmarks/**'
      - '.github/scripts/benchmark_docs.py'
      - '.github/workflows/benchmark-comparison.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet filter (e.g. *Get* to run only GET benchmarks)'
        required: false
        default: '*'
      job:
        description: 'BenchmarkDotNet job preset'
        required: false
        default: short
        type: choice
        options:
          - short
          - default
          - medium
          - long

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

jobs:
  comparison-benchmarks:
    name: Benchmark (${{ matrix.framework }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]

    services:
      redis:
        image: redis:8.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build benchmarks
        run: dotnet build benchmarks/Respire.ComparisonBenchmarks -c Release

      - name: Run comparison benchmarks
        working-directory: benchmarks/Respire.ComparisonBenchmarks
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          BENCH_FILTER: ${{ github.event.inputs.filter || '*' }}
          BENCH_JOB: ${{ github.event.inputs.job || 'short' }}
        run: |
          dotnet run -c Release -f ${{ matrix.framework }} --no-build -- \
            --filter "$BENCH_FILTER" \
            --job "$BENCH_JOB" \
            --exporters json markdown \
            --artifacts ./BenchmarkDotNet.Artifacts

      - name: Publish results to job summary
        if: always()
        run: |
          echo "## Respire vs StackExchange.Redis (${{ matrix.framework }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Baseline is StackExchange.Redis — a Ratio below 1.00 means Respire is faster." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESULTS_DIR="benchmarks/Respire.ComparisonBenchmarks/BenchmarkDotNet.Artifacts/results"
          if compgen -G "$RESULTS_DIR/*-report-github.md" > /dev/null; then
            cat "$RESULTS_DIR"/*-report-github.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No benchmark results found in $RESULTS_DIR" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: comparison-benchmarks-${{ matrix.framework }}
          path: benchmarks/Respire.ComparisonBenchmarks/BenchmarkDotNet.Artifacts/
          retention-days: 90

  publish-to-docs:
    name: Publish benchmark documentation
    needs: comparison-benchmarks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.filter == '*')
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write

    concurrency:
      group: performance-docs-publish
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download benchmark artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: comparison-benchmarks-*
          path: benchmark-results

      - name: Generate benchmark documentation
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/benchmark_docs.py \
            --results-dir benchmark-results \
            --commit "${{ github.sha }}" \
            --generated-at "$(date -u +'%Y-%m-%d %H:%M UTC')" \
            --run-url "$RUN_URL" \
            --output website/docs/benchmarks.md

      - name: Commit benchmark documentation
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/docs/benchmarks.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs: update benchmark results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated documentation
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
