name: Respire vs StackExchange.Redis Benchmarks

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      stackexchange-version:
        description: 'Pinned comparison dependency (repository uses the normal weekly baseline)'
        required: false
        default: repository
        type: choice
        options:
          - repository
          - '3.4.5'
          - '4.0.127-alpha'
      filter:
        description: 'BenchmarkDotNet filter (e.g. *Get* to run only GET benchmarks)'
        required: false
        default: '*'
      job:
        description: 'BenchmarkDotNet job preset (medium matches the scheduled run)'
        required: false
        default: medium
        type: choice
        options:
          - dry
          - short
          - default
          - medium
          - long
      profile-pubsub:
        description: 'Also collect pub/sub phase samples and a separate EventPipe trace (timings are diagnostic only)'
        required: false
        default: false
        type: boolean

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

jobs:
  comparison-benchmarks:
    name: Benchmark (${{ matrix.framework }})
    runs-on: ubuntu-latest
    env:
      STACKEXCHANGE_REDIS_BENCHMARK_VERSION: ${{ inputs.stackexchange-version || 'repository' }}

    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0]

    services:
      redis:
        image: mirror.gcr.io/library/redis:8.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      # Load infrastructure from the workflow revision, independently of benchmark source revisions.
      - name: Checkout Docker mirror action
        id: docker-mirror-checkout
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: docker-mirror
          sparse-checkout: .github/actions/docker-hub-mirror
          persist-credentials: false
      - name: Use Docker Hub mirror
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && steps.docker-mirror-checkout.outcome == 'success'
        uses: ./docker-mirror/.github/actions/docker-hub-mirror
      - name: Warn if Docker mirror action could not be loaded
        if: steps.docker-mirror-checkout.outcome == 'failure'
        shell: bash
        run: echo '::warning::Could not load Docker mirror action; pulls go straight to Docker Hub'
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Build benchmarks
        run: dotnet build benchmarks/Respire.ComparisonBenchmarks -c Release -f ${{ matrix.framework }}

      - name: Record dependency and rig metadata
        env:
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          artifacts=benchmarks/Respire.ComparisonBenchmarks/BenchmarkDotNet.Artifacts
          mkdir -p "$artifacts"
          cp benchmarks/Respire.ComparisonBenchmarks/obj/project.assets.json "$artifacts/project.assets.json"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Requested StackExchange.Redis: $STACKEXCHANGE_REDIS_BENCHMARK_VERSION"
            echo "Runner image: $ImageOS $ImageVersion"
            echo 'Redis endpoint: localhost:6379 (Docker port mapping, no TLS)'
            echo 'Redis image: mirror.gcr.io/library/redis:8.10'
            docker inspect "$REDIS_CONTAINER_ID" --format 'Redis image ID: {{.Image}}'
            docker exec "$REDIS_CONTAINER_ID" redis-server --version
            uname -a
            lscpu
            dotnet --info
            python3 -c 'import json; a=json.load(open("benchmarks/Respire.ComparisonBenchmarks/obj/project.assets.json")); print("Resolved dependencies:"); print("\n".join(sorted(a["libraries"])))'
          } > "$artifacts/rig.txt"

      - name: Run comparison benchmarks
        working-directory: benchmarks/Respire.ComparisonBenchmarks
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          BENCH_FILTER: ${{ github.event.inputs.filter || '*' }}
          # The scheduled/default manual run uses medium; dry validates setup only.
          BENCH_JOB: ${{ github.event.inputs.job || (github.event_name == 'schedule' && 'medium' || 'short') }}
        run: |
          dotnet run -c Release -f ${{ matrix.framework }} --no-build -- \
            --filter "$BENCH_FILTER" \
            --job "$BENCH_JOB" \
            --launchCount 2 \
            --statisticalTest 5% \
            --exporters json markdown \
            --artifacts ./BenchmarkDotNet.Artifacts

      - name: Profile pub/sub acknowledgement and consumer scheduling separately
        if: inputs.profile-pubsub == true
        working-directory: benchmarks/Respire.ComparisonBenchmarks
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          set -euo pipefail
          mkdir -p BenchmarkDotNet.Artifacts/pubsub-profile
          dotnet run -c Release -f net10.0 --no-build -- \
            --profile-pubsub BenchmarkDotNet.Artifacts/pubsub-profile/phases.json \
            > BenchmarkDotNet.Artifacts/pubsub-profile/phases.log 2>&1
          # EP attaches to measurement iterations. Keep its perturbed timings out of
          # the unprofiled comparison reports and never use them for a speed claim.
          dotnet run -c Release -f net10.0 --no-build -- \
            --filter '*PubSubComparisonBenchmarks*' --job short --profiler EP --threading \
            --exporters json markdown --artifacts ./BenchmarkDotNet.Artifacts/pubsub-profile/eventpipe \
            > BenchmarkDotNet.Artifacts/pubsub-profile/eventpipe.log 2>&1

      - name: Publish results to job summary
        if: always()
        run: |
          echo "## Respire vs StackExchange.Redis $STACKEXCHANGE_REDIS_BENCHMARK_VERSION (${{ matrix.framework }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Baseline is StackExchange.Redis — a Ratio below 1.00 means Respire is faster." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESULTS_DIR="benchmarks/Respire.ComparisonBenchmarks/BenchmarkDotNet.Artifacts/results"
          if [ -f "${RESULTS_DIR%/results}/rig.txt" ]; then
            echo '<details><summary>Dependency versions and rig</summary>' >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat "${RESULTS_DIR%/results}/rig.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo '</details>' >> $GITHUB_STEP_SUMMARY
          fi
          if compgen -G "$RESULTS_DIR/*-report-github.md" > /dev/null; then
            cat "$RESULTS_DIR"/*-report-github.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No benchmark results found in $RESULTS_DIR" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate and summarize pub/sub diagnostics
        if: inputs.profile-pubsub == true
        shell: python
        run: |
          import json
          import math
          import os
          from pathlib import Path
          root = Path('benchmarks/Respire.ComparisonBenchmarks/BenchmarkDotNet.Artifacts/pubsub-profile')
          profile = json.loads((root / 'phases.json').read_text())
          assert profile['SchemaVersion'] == 1
          samples = profile['Samples']
          assert len(samples) == 10000
          assert {s['Client'] for s in samples} == {'Respire', 'StackExchange.Redis'}
          lines = ['## Pub/sub diagnostic phases (instrumented, not comparison timings)', '',
                   profile['Notes'], '',
                   '| Client | Phase | Mean us | P50 us | P95 us | P99 us | Synchronous reads |',
                   '| --- | --- | ---: | ---: | ---: | ---: | ---: |']
          for client in ('Respire', 'StackExchange.Redis'):
              rows = [s for s in samples if s['Client'] == client]
              assert len(rows) == 5000
              synchronous = sum(s['ReadCompletedSynchronously'] for s in rows)
              for phase in ('AckMicroseconds', 'AfterAckMicroseconds'):
                  values = sorted(s[phase] for s in rows)
                  assert all(math.isfinite(v) and v >= 0 for v in values)
                  percentiles = [values[math.ceil(len(values) * p) - 1] for p in (.50, .95, .99)]
                  cells = ' | '.join(f'{v:.3f}' for v in [sum(values) / len(values), *percentiles])
                  lines.append(f'| {client} | {phase} | {cells} | {synchronous}/5000 |')
          for method in ('Respire_PublishAndConsume', 'StackExchange_PublishAndConsume'):
              assert list((root / 'eventpipe').rglob(f'*{method}*.nettrace')), f'Missing trace: {method}'
              assert list((root / 'eventpipe').rglob(f'*{method}*.speedscope.json')), f'Missing CPU profile: {method}'
          summary = '\n'.join(lines) + '\n'
          (root / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary)

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison-benchmarks-${{ matrix.framework }}${{ inputs.stackexchange-version && inputs.stackexchange-version != 'repository' && format('-seredis-{0}', inputs.stackexchange-version) || '' }}
          path: benchmarks/Respire.ComparisonBenchmarks/BenchmarkDotNet.Artifacts/
          retention-days: 90

  publish-to-docs:
    name: Publish benchmark documentation
    needs: comparison-benchmarks
    # Docs are refreshed only from full, higher-iteration runs: the weekly scheduled run,
    # or a manual dispatch using the repository baseline, default filter and a
    # measurement job longer than short. Version-specific runs are reviewed separately.
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.profile-pubsub != true &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.filter == '*' &&
        (inputs.stackexchange-version == 'repository' || inputs.stackexchange-version == '') &&
        github.event.inputs.job != 'dry' &&
        github.event.inputs.job != 'short'))
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    concurrency:
      group: performance-docs-publish
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.BENCHMARK_DOCS_PAT }}

      - name: Download benchmark artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: comparison-benchmarks-*
          path: benchmark-results

      - name: Generate benchmark documentation
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/benchmark_docs.py \
            --results-dir benchmark-results \
            --commit "${{ github.sha }}" \
            --generated-at "$(date -u +'%Y-%m-%d %H:%M UTC')" \
            --run-url "$RUN_URL" \
            --output website/docs/benchmarks.md

      - name: Commit benchmark documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/docs/benchmarks.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update benchmark results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
