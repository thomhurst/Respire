name: Command retry owner benchmarks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  policies:
    if: github.event.label.name == 'run-command-retry-owner-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/CommandRetryOwnerBenchmarks.cs
      filter: '*CommandRetryOwnerBenchmarks*'
      expected-case-count: 18
      expected-methods: Read
      artifact-prefix: command-retry-owner-policies
      job: Short
      redis-server: true
      retry-topologies: true
      retained-memory: true
      retained-memory-stages: before-connect,connected-idle,after-churn,after-dispose
      retained-memory-dimensions: owner,policy

  historical-default:
    if: github.event.label.name == 'run-command-retry-default-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      # Last main revision before the immediate retry foundation, PR #1500.
      # This historical control includes intervening changes; it is not an isolated retry ablation.
      control-sha: 15b7adf5090cce616d5fa395f96fb5f38d344ce1
      fixture: benchmarks/Respire.Benchmarks/CommandRetryOwnerBenchmarks.cs
      filter: '*CommandRetryOwnerBenchmarks*'
      expected-case-count: 6
      expected-methods: Read
      artifact-prefix: command-retry-historical-default
      default-policy-only: true
      redis-server: true
      retry-topologies: true
      retained-memory: true
      retained-memory-stages: before-connect,connected-idle,after-churn,after-dispose
      retained-memory-dimensions: owner,policy

  aggregate-audit:
    if: github.event.label.name == 'run-command-retry-audit-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      # Current main already contains tracked retries/pooling. Pin a compilable
      # control before those changes. Intervening changes remain included, so this
      # is not an isolated pooling or dispatch ablation.
      control-sha: a19b9590235f6d2ad0f0e7d41dfafccbbb9b5394
      fixture: benchmarks/Respire.Benchmarks/CommandRetryOwnerBenchmarks.cs
      filter: '*CommandRetryOwnerBenchmarks*'
      expected-case-count: 18
      expected-methods: Read
      artifact-prefix: command-retry-aggregate-audit
      job: Medium
      redis-server: true
      retry-topologies: true
      retained-memory: true
      retained-memory-stages: before-connect,connected-idle,after-churn,after-dispose
      retained-memory-dimensions: owner,policy

  # Whole-unit batch and unwatched transaction retries (#1216). One label starts both
  # the policy comparison on the current base and the pre-whole-unit historical control.
  unit-policies:
    if: github.event.label.name == 'run-unit-retry-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/UnitRetryBenchmarks.cs
      filter: '*UnitRetryBenchmarks*'
      expected-case-count: 18
      expected-methods: Batch,Transaction
      artifact-prefix: unit-retry-policies
      job: Medium
      redis-server: true
      retry-topologies: true
      retained-memory: true
      retained-memory-stages: before-connect,connected-idle,after-churn,after-dispose
      retained-memory-dimensions: owner,policy

  unit-historical-default:
    if: github.event.label.name == 'run-unit-retry-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      # Last main revision before the whole-unit retry children (#1529, #1530, #1528, #1533).
      # Intervening changes remain included; this is not an isolated retry ablation.
      control-sha: a30f0fba3723e967b3ab580310e5de9051b32a79
      fixture: benchmarks/Respire.Benchmarks/UnitRetryBenchmarks.cs
      filter: '*UnitRetryBenchmarks*'
      expected-case-count: 6
      expected-methods: Batch,Transaction
      artifact-prefix: unit-retry-historical-default
      job: Medium
      default-policy-only: true
      redis-server: true
      retry-topologies: true
      retained-memory: true
      retained-memory-stages: before-connect,connected-idle,after-churn,after-dispose
      retained-memory-dimensions: owner,policy
