name: Local initialization benchmarks

on:
  pull_request:
    paths:
      - 'Directory.Build.props'
      - 'src/Shared/SkipLocalsInit.cs'
      - 'src/Respire/Internal/Utf8String.cs'
      - 'benchmarks/Respire.Benchmarks/ProtocolBenchmarks.cs'
      - '.github/workflows/benchmark-local-initialization.yml'

permissions:
  contents: read

concurrency:
  group: local-initialization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Single operations (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    env:
      FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the comparison to the PR head and its common base
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
          comparison_base=$(git -C candidate merge-base "$HEAD_SHA" "refs/remotes/origin/$BASE_REF")
          git -C baseline checkout --detach "$comparison_base"
          git -C candidate diff "$comparison_base" "$HEAD_SHA" > comparison-source.patch
          printf '%s\n' "COMPARISON_BASE_SHA=$comparison_base" >> "$GITHUB_ENV"
          COMPARISON_BASE_SHA="$comparison_base" python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          manifest = {
              "head_sha": os.environ["HEAD_SHA"],
              "event_base_sha": os.environ["EVENT_BASE_SHA"],
              "fetched_base_sha": subprocess.check_output(
                  ["git", "-C", "candidate", "rev-parse", "refs/remotes/origin/" + os.environ["BASE_REF"]],
                  text=True).strip(),
              "comparison_base_sha": os.environ["COMPARISON_BASE_SHA"],
          }
          Path("source-shas.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
      - name: Use identical fixtures with jobs controlled by the command line
        shell: python
        run: |
          from pathlib import Path
          fixture = Path('candidate/benchmarks/Respire.Benchmarks/ProtocolBenchmarks.cs').read_text()
          job = '[SimpleJob(warmupCount: 3, iterationCount: 10)]'
          assert fixture.count(job) == 1, 'Review benchmark job configuration before changing the fixture'
          fixture = fixture.replace(job, '')
          for source in ('baseline', 'candidate'):
              Path(source, 'benchmarks/Respire.Benchmarks/ProtocolBenchmarks.cs').write_text(fixture)
      - name: Compare ten single operations against bracketing baseline controls
        shell: bash
        env:
          # Keep runtime JIT output for code-generation evidence. The net8 baseline
          # crashed after measurement with BDN disassembly enabled (#1035).
          DOTNET_JitDisasm: Respire.Internal.Utf8String:GetString Respire.Benchmarks.ProtocolBenchmarks:*UnicodeBulkString
          DOTNET_JitDisasmDiffable: '1'
        run: |
          set -euo pipefail
          for phase in baseline-validation candidate-validation baseline-a candidate baseline-b; do
            source=baseline
            job=Default
            if [[ "$phase" == candidate* ]]; then source=candidate; fi
            if [[ "$phase" == *validation ]]; then job=Dry; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f "$FRAMEWORK" -- \
                --filter '*ProtocolBenchmarks.DecodeAsciiBulkString' '*ProtocolBenchmarks.ReadAsciiBulkString' \
                '*ProtocolBenchmarks.DecodeUnicodeBulkString' '*ProtocolBenchmarks.ReadUnicodeBulkString' \
                '*ProtocolBenchmarks.FormatAsciiBulkString' '*ProtocolBenchmarks.FormatLargeAsciiBulkString' \
                '*ProtocolBenchmarks.FormatUnicodeBulkString' \
                '*ProtocolBenchmarks.FormatLargeUnicodeBulkString' \
                '*ProtocolBenchmarks.BuildGetCommand' '*ProtocolBenchmarks.BuildSetCommand' \
                --job "$job" --exporters json markdown \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require successful measurements and publish results
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          sources = json.loads(Path('source-shas.json').read_text())
          expected = {'DecodeAsciiBulkString', 'ReadAsciiBulkString', 'DecodeUnicodeBulkString',
                      'ReadUnicodeBulkString', 'BuildGetCommand', 'BuildSetCommand',
                      'FormatAsciiBulkString', 'FormatLargeAsciiBulkString', 'FormatUnicodeBulkString',
                      'FormatLargeUnicodeBulkString'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Single operations before/after\n\nThe candidate is the pinned PR head, excluding the synthetic merge commit. Both controls use its common ancestor with the fetched target branch, so intervening main changes are present in both builds or excluded from both. Compare latency, dispersion, allocations, and JIT output before merge. These ten local protocol operations do not measure network throughput.\n')
              summary.write(f"\nComparison base: {sources['comparison_base_sha']}. PR head: {sources['head_sha']}.\n")
              for phase in ('baseline-validation', 'candidate-validation', 'baseline-a', 'candidate', 'baseline-b'):
                  expected_sha = sources['head_sha'] if phase.startswith('candidate') else sources['comparison_base_sha']
                  assert Path(f'{phase}.log').read_text().splitlines()[0] == expected_sha, f'Wrong source: {phase}'
                  reports = list(Path('results', phase, 'results').glob('*-report-full-compressed.json'))
                  assert len(reports) == 1, f'Missing or duplicate report: {phase}'
                  cases = json.loads(reports[0].read_text())['Benchmarks']
                  assert len(cases) == 10 and {case['Method'] for case in cases} == expected, phase
                  assert all(case.get('Statistics') and case['Statistics']['Mean'] > 0 for case in cases), phase
                  if 'validation' not in phase:
                      summary.write(f'\n### {phase}\n\n')
                      summary.write(next(Path('results', phase, 'results').glob('*-report-github.md')).read_text())
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: local-initialization-${{ matrix.framework }}
          path: |
            results/
            *.log
            source-shas.json
            comparison-source.patch
          retention-days: 30
