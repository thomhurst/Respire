name: Flush signal stress comparison

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  compare:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'benchmark-flush-signal') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'benchmark-flush-signal'))
    name: Compare flush signaling on Linux
    concurrency:
      group: flush-signal-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:8.10@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RESPIRE_CONNECTIONS: 1
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Validate Linux flush and stalled-delivery regressions on both frameworks
        working-directory: candidate
        run: |
          set -euo pipefail
          for framework in net8.0 net10.0; do
            dotnet run --project tests/Respire.Tests -c Release -f "$framework" -- \
              --treenode-filter '/*/*/(AsyncFlushSignalTests)|(FlushWakeTests)|(StalledDeliveryTests)|(TransportRetirementTests)|(ReceiveLoopStartupTests)/*'
          done
      - name: Build identical stress harnesses against each revision
        run: |
          set -euo pipefail
          mkdir -p results
          cp -a candidate/tools/Respire.StressTests/. baseline/tools/Respire.StressTests/
          for source in baseline candidate; do
            git -C "$source" rev-parse HEAD > "results/$source.sha"
            dotnet build "$source/tools/Respire.StressTests" -c Release -f net10.0
          done
          dotnet --info > results/runtime.txt
          lscpu > results/cpu.txt
      - name: Interleave sustained c=50 runs and idle-connection controls
        run: |
          set -euo pipefail
          for phase in baseline-a candidate-a baseline-b candidate-b baseline-c; do
            source=baseline
            if [[ "$phase" == candidate-* ]]; then source=candidate; fi
            for scenario in ping get; do
              dotnet run --project "$source/tools/Respire.StressTests" -c Release -f net10.0 --no-build -- \
                --scenario "$scenario" --client respire --concurrency 50 --warmup 10 --duration-seconds 60 \
                --output "$GITHUB_WORKSPACE/results/$phase/c50/$scenario" \
                > "results/$phase-$scenario-c50.log" 2>&1
            done
            if [[ "$phase" != candidate-b && "$phase" != baseline-c ]]; then
              dotnet run --project "$source/tools/Respire.StressTests" -c Release -f net10.0 --no-build -- \
                --scenario ping --client respire --concurrency 1 --warmup 10 --duration-seconds 30 \
                --output "$GITHUB_WORKSPACE/results/$phase/c1/ping" \
                > "results/$phase-ping-c1.log" 2>&1
            fi
          done
      - name: Require complete runs and report CPU per operation with control variation
        shell: python
        run: |
          import json, os, statistics
          from pathlib import Path
          root = Path('results')
          phases = ('baseline-a', 'candidate-a', 'baseline-b', 'candidate-b', 'baseline-c')
          rows = {}
          lines = ['## Flush signal: one connection, Linux .NET 10', '',
                   '| Phase | Scenario | Concurrency | Operations/s | CPU µs/op | Allocated B/op |',
                   '| --- | --- | ---: | ---: | ---: | ---: |']
          for phase in phases:
              cases = [(50, 'ping'), (50, 'get')]
              if phase in phases[:3]: cases.append((1, 'ping'))
              for concurrency, scenario in cases:
                  files = list((root / phase / f'c{concurrency}' / scenario).glob('*.json'))
                  assert len(files) == 1, (phase, concurrency, scenario, files)
                  row = json.loads(files[0].read_text())
                  assert row['Concurrency'] == concurrency and row['Scenario'] == scenario, row
                  assert row['Client'] == 'Respire' and not row['Failed'] and not row['Stalled'], row
                  assert row['Errors'] == 0 and row['Operations'] > 0, row
                  assert row['ElapsedSeconds'] >= (55 if concurrency == 50 else 25), row
                  assert row['CpuMicrosecondsPerOperation'] > 0, row
                  rows[phase, concurrency, scenario] = row
                  lines.append(f"| {phase} | {scenario} | {concurrency} | {row['OperationsPerSecond']:.1f} | "
                               f"{row['CpuMicrosecondsPerOperation']:.4f} | {row['AllocatedBytesPerOperation']:.2f} |")
          lines += ['', '## c=50 comparison', '',
                    'Negative CPU deltas mean improvement. Inspect all launches and baseline variation before accepting the change.', '']
          for scenario in ('ping', 'get'):
              controls = [rows[p, 50, scenario]['CpuMicrosecondsPerOperation'] for p in phases if p.startswith('baseline')]
              candidates = [rows[p, 50, scenario]['CpuMicrosecondsPerOperation'] for p in phases if p.startswith('candidate')]
              baseline = statistics.median(controls)
              candidate = statistics.median(candidates)
              lines.append(f"- {scenario}: candidate median {candidate:.4f} µs/op versus baseline median {baseline:.4f} µs/op "
                           f"({100 * (candidate / baseline - 1):+.2f}%); controls {min(controls):.4f}–{max(controls):.4f}; "
                           f"candidates {min(candidates):.4f}–{max(candidates):.4f}.")
          report = '\n'.join(lines) + '\n'
          (root / 'comparison.md').write_text(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output: output.write(report)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: flush-signal-comparison
          path: |
            results/
            candidate/**/TestResults/*-report.html
