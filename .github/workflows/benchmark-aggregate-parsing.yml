name: Aggregate parsing benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/Respire/Protocol/**'
      - 'benchmarks/Respire.Benchmarks/Aggregate*Benchmarks.cs'
      - '.github/workflows/benchmark-aggregate-parsing.yml'
      - '.github/workflows/benchmark-compare.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  parsing:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-aggregate-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/AggregateParsingBenchmarks.cs
      filter: '*AggregateParsingBenchmarks*'
      expected-case-count: 8
      expected-methods: Complete,Nested,ScalarBatch,Fragmented
      zero-allocation-methods: Complete,Nested,ScalarBatch,Fragmented
      artifact-prefix: aggregate-parsing
  payload:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-aggregate-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/AggregatePayloadBenchmarks.cs
      filter: '*AggregatePayloadBenchmarks*'
      expected-case-count: 4
      expected-methods: MGet,HGetAll,RetainedMGet,RetainedHGetAll
      artifact-prefix: aggregate-payload
