name: Retirement regressions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - 'src/Respire/Networking/**'
      - 'src/Respire/Infrastructure/**'
      - 'tests/Respire.Tests/Networking/**'
      - 'tests/Respire.Tests/TestCategories.cs'
      - 'tests/Respire.Tests/Respire.Tests.csproj'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'scripts/Assert-RetirementResults.ps1'
      - '.github/workflows/retirement-regressions.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retirement:
    name: Retirement (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
    env:
      DOTNET_PROCESSOR_COUNT: 2
      TUNIT_DISABLE_HTML_REPORTER: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Validate constrained flush and retirement coordination
        shell: pwsh
        run: |
          dotnet --info
          $retirementArguments = @(
            'run', '--project', 'tests/Respire.Tests', '-c', 'Release', '-f', '${{ matrix.framework }}', '--',
            '--treenode-filter', '/*/*/*/*[Category=ConstrainedRetirement]',
            '--report-trx', '--results-directory', "$env:RUNNER_TEMP/retirement"
          )
          dotnet @retirementArguments
          exit $LASTEXITCODE
      - name: Verify selected retirement coverage
        shell: pwsh
        run: ./scripts/Assert-RetirementResults.ps1 -ResultsDirectory "$env:RUNNER_TEMP/retirement"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retirement-${{ matrix.os }}-${{ matrix.framework }}
          path: ${{ runner.temp }}/retirement/*.trx
