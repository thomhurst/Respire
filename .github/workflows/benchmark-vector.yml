name: Vector encoding benchmarks

on:
  pull_request:
    paths:
      - 'src/Respire/Commands/VectorCommand.cs'
      - 'src/Respire/Protocol/RespWriter.cs'
      - 'benchmarks/Respire.Benchmarks/VectorEncodingBenchmarks.cs'
      - '.github/workflows/benchmark-vector.yml'

permissions:
  contents: read

jobs:
  vector-comparison:
    name: Compare vector encoding (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Validate and compare six focused cases on one runner
        shell: bash
        run: |
          set -euo pipefail
          # Coverage and parameters must be identical in both pinned checkouts.
          cp candidate/benchmarks/Respire.Benchmarks/VectorEncodingBenchmarks.cs baseline/benchmarks/Respire.Benchmarks/
          for phase in validation baseline-a candidate baseline-b; do
            source=baseline
            job=Default
            if [ "$phase" = candidate ] || [ "$phase" = validation ]; then source=candidate; fi
            if [ "$phase" = validation ]; then job=Dry; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --filter '*VectorEncodingBenchmarks*' --job "$job" --exporters fulljson markdown \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require complete measurements and size evidence
        shell: python
        run: |
          import json
          from pathlib import Path
          expected_methods = {"DirectFp32", "IntermediateArrayFp32", "Values"}
          expected_sizes = None
          for phase in ("validation", "baseline-a", "candidate", "baseline-b"):
              reports = list(Path("results", phase, "results").glob("*-report*.json"))
              assert len(reports) == 1, f"Expected one focused report: {phase}"
              benchmarks = json.loads(reports[0].read_text())["Benchmarks"]
              assert len(benchmarks) == 6, f"Expected six focused cases: {phase}"
              assert {b["Method"] for b in benchmarks} == expected_methods
              for benchmark in benchmarks:
                  statistics = benchmark.get("Statistics")
                  assert statistics and statistics["Mean"] > 0, f"Failed case: {phase}/{benchmark['Method']}"
                  assert benchmark.get("Memory") is not None, f"Missing allocations: {phase}"
              sizes = [json.loads(line.split("VECTOR_ENCODING_SIZE ", 1)[1])
                       for line in Path(f"{phase}.log").read_text().splitlines()
                       if line.startswith("VECTOR_ENCODING_SIZE ")]
              distinct_sizes = {(s["Dimensions"], s["Fp32Bytes"], s["ValuesBytes"]) for s in sizes}
              assert {s[0] for s in distinct_sizes} == {16, 1536}, f"Missing sizes: {phase}"
              assert len(distinct_sizes) == 2, f"Inconsistent encoded sizes: {phase}"
              if expected_sizes is None: expected_sizes = distinct_sizes
              assert distinct_sizes == expected_sizes, f"Encoded sizes changed: {phase}"
      - name: Publish comparison reports
        if: always()
        shell: bash
        run: |
          echo 'Focused VADD encoding only; no network or server work. Compare methods within each phase and use A/B/A to observe runner drift.' >> "$GITHUB_STEP_SUMMARY"
          for phase in baseline-a candidate baseline-b; do
            echo "## $phase" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            grep '^VECTOR_ENCODING_SIZE ' "$GITHUB_WORKSPACE/$phase.log" | sort -u >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            for report in "$GITHUB_WORKSPACE/results/$phase/results/"*-report-default.md; do
              if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vector-encoding-comparison
          path: |
            results/
            *.log
