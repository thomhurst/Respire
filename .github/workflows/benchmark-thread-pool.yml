name: Thread-pool monitoring benchmarks

on:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - 'src/Respire/Internal/ThreadPoolMonitor.cs'
      - 'src/Respire/Internal/ClientCore.cs'
      - 'src/Respire/Internal/RespireTelemetry.cs'
      - 'src/Respire/RespireOptions.cs'
      - 'src/Respire/RespireThreadPoolSnapshot.cs'
      - 'benchmarks/Respire.Benchmarks/ThreadPoolMonitoringBenchmarks.cs'
      - '.github/workflows/benchmark-thread-pool.yml'
permissions:
  contents: read

concurrency:
  # A newer commit on the same PR or branch supersedes older runs. Every main commit still runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  thread-pool-comparison:
    if: contains(github.event.pull_request.labels.*.name, 'run-benchmarks')
    name: Compare thread-pool monitoring (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Compare pinned baseline, candidate, baseline on one runner
        shell: bash
        run: |
          set -euo pipefail
          # The new coverage case must run against identical sources in both checkouts.
          cp candidate/benchmarks/Respire.Benchmarks/ThreadPoolMonitoringBenchmarks.cs baseline/benchmarks/Respire.Benchmarks/
          for phase in validation baseline-a candidate baseline-b; do
            source=baseline
            job=Medium
            filter='*ThreadPoolMonitoringBenchmarks*'
            if [ "$phase" = candidate ] || [ "$phase" = validation ]; then source=candidate; fi
            if [ "$phase" = validation ]; then job=Dry; filter='*ThreadPoolMonitoringBenchmarks*'; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --filter "$filter" --job "$job" --exporters json markdown \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require completed measurements
        shell: python
        run: |
          import json
          from pathlib import Path
          for phase in ("validation", "baseline-a", "candidate", "baseline-b"):
              reports = list(Path("results", phase, "results").glob("*-report*.json"))
              assert reports, f"Missing benchmark results: {phase}"
              metrics = [json.loads(line.split("THREAD_POOL_PROCESS_METRICS ", 1)[1])
                         for line in Path(f"{phase}.log").read_text().splitlines()
                         if line.startswith("THREAD_POOL_PROCESS_METRICS ")]
              for enabled in (False, True):
                  for stage in ("idle", "workload"):
                      samples = [m for m in metrics if m["MonitoringEnabled"] == enabled and m["phase"] == stage]
                      assert samples, f"Missing process metrics: {phase}/{enabled}/{stage}"
                      assert all(m["elapsedSeconds"] > 0 and m["cpuMilliseconds"] >= 0 and m["allocatedBytes"] >= 0 for m in samples)
                      if phase in ("validation", "candidate"): assert all(m["probeSupported"] for m in samples)
              for report in reports:
                  benchmarks = json.loads(report.read_text())["Benchmarks"]
                  assert len(benchmarks) == 2, f"Expected enabled/disabled cases: {report}"
                  for benchmark in benchmarks:
                      statistics = benchmark.get("Statistics")
                      assert statistics and statistics["Mean"] > 0, f"Failed benchmark: {report}"
      - name: Publish comparison reports
        if: always()
        shell: bash
        run: |
          echo "Informational A/B/A measurements; review timing and allocation reports before merge. This job does not enforce a regression threshold." >> "$GITHUB_STEP_SUMMARY"
          for phase in baseline-a candidate baseline-b; do
            echo "## $phase" >> "$GITHUB_STEP_SUMMARY"
            echo 'Process CPU and allocations include background work; workload totals also include BDN warmup and overhead.' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            grep '^THREAD_POOL_PROCESS_METRICS ' "$GITHUB_WORKSPACE/$phase.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            for report in "$GITHUB_WORKSPACE/results/$phase/results/"*-report-default.md; do
              if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: thread-pool-monitoring-comparison
          path: |
            results/
            *.log
