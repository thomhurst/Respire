name: Redis Throughput Benchmarks

on:
  workflow_dispatch:
    inputs:
      concurrent-clients:
        description: 'Number of concurrent clients (comma-separated)'
        required: false
        default: '1,10,50'
      operations-per-client:
        description: 'Operations per client'
        required: false
        default: '100'
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  redis-throughput-benchmarks:
    name: Run Redis Throughput Benchmarks
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        framework: [net10.0]
    
    steps:
      # Load infrastructure from the workflow revision, independently of benchmark source revisions.
      - name: Checkout Docker mirror action
        id: docker-mirror-checkout
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: docker-mirror
          sparse-checkout: .github/actions/docker-hub-mirror
          persist-credentials: false
      - name: Use Docker Hub mirror
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && steps.docker-mirror-checkout.outcome == 'success'
        uses: ./docker-mirror/.github/actions/docker-hub-mirror
      - name: Warn if Docker mirror action could not be loaded
        if: steps.docker-mirror-checkout.outcome == 'failure'
        shell: bash
        run: echo '::warning::Could not load Docker mirror action; pulls go straight to Docker Hub'
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build -c Release --no-restore
      
      - name: Set benchmark parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "concurrent_clients=${{ github.event.inputs.concurrent-clients }}" >> $GITHUB_OUTPUT
            echo "operations=${{ github.event.inputs.operations-per-client }}" >> $GITHUB_OUTPUT
          else
            echo "concurrent_clients=1,10,50" >> $GITHUB_OUTPUT
            echo "operations=100" >> $GITHUB_OUTPUT
          fi
      
      - name: Run Redis Throughput Benchmarks
        env:
          RESPIRE_THROUGHPUT_CLIENTS: ${{ steps.params.outputs.concurrent_clients }}
          RESPIRE_THROUGHPUT_OPERATIONS: ${{ steps.params.outputs.operations }}
        run: |
          cd benchmarks/Respire.Benchmarks
          
          # One run covers every client count; the benchmark reads its params from the environment.
          dotnet run -c Release -f ${{ matrix.framework }} -- \
            --filter "*RedisThroughputBenchmarks*" \
            --exporters json markdown html \
            --artifacts ./BenchmarkDotNet.Artifacts \
            --iterationCount 5 \
            --warmupCount 3
      
      - name: Generate throughput report
        run: |
          report=benchmarks/Respire.Benchmarks/throughput-report.md
          {
            echo "# Redis Throughput Benchmark Report"
            echo ""
            echo "## Configuration"
            echo "- Framework: ${{ matrix.framework }}"
            echo "- Concurrent Clients: ${{ steps.params.outputs.concurrent_clients }}"
            echo "- Operations per Client: ${{ steps.params.outputs.operations }}"
            echo "- Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo ""
            echo "## Results Summary"
            echo ""
            cat benchmarks/Respire.Benchmarks/BenchmarkDotNet.Artifacts/results/*-report-github.md
          } > "$report"
      
      - name: Generate GitHub Summary
        run: |
          echo "## 🚀 Redis Throughput Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Framework** | ${{ matrix.framework }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Concurrent Clients** | ${{ steps.params.outputs.concurrent_clients }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Operations per Client** | ${{ steps.params.outputs.operations }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runner** | ${{ runner.os }} - ${{ runner.arch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Add throughput report if it exists
          if [ -f "benchmarks/Respire.Benchmarks/throughput-report.md" ]; then
            echo "### 📈 Throughput Analysis" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Extract key sections from the report
            sed -n '/## Results Summary/,/^##/p' benchmarks/Respire.Benchmarks/throughput-report.md | head -n -1 >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Add comparison insights
          echo "### 💡 Benchmark Insights" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Higher **Ops/sec** indicates better throughput" >> $GITHUB_STEP_SUMMARY
          echo "- Lower **Mean** time indicates better latency" >> $GITHUB_STEP_SUMMARY
          echo "- **P95** shows the 95th percentile latency (consistency indicator)" >> $GITHUB_STEP_SUMMARY
          echo "- Compare Respire performance against StackExchange.Redis baseline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Add full report as collapsed section
          if [ -f "benchmarks/Respire.Benchmarks/throughput-report.md" ]; then
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>📄 View Complete Throughput Report</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```markdown' >> $GITHUB_STEP_SUMMARY
            cat benchmarks/Respire.Benchmarks/throughput-report.md >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Throughput benchmarks powered by [BenchmarkDotNet](https://benchmarkdotnet.org/)*" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: redis-throughput-benchmarks-${{ matrix.framework }}
          path: |
            benchmarks/Respire.Benchmarks/BenchmarkDotNet.Artifacts/
            benchmarks/Respire.Benchmarks/throughput-report.md
          retention-days: 30
      
      - name: Upload throughput report as release asset (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: benchmarks/Respire.Benchmarks/throughput-report.md
          name: Throughput Benchmark Report - ${{ matrix.framework }}
