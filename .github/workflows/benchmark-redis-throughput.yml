name: Redis Throughput Benchmarks

on:
  workflow_dispatch:
    inputs:
      concurrent-clients:
        description: 'Number of concurrent clients (comma-separated)'
        required: false
        default: '1,10,50'
      operations-per-client:
        description: 'Operations per client'
        required: false
        default: '100'
  schedule:
    # Weekly, Sunday 02:00 UTC
    - cron: '0 2 * * 0'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

jobs:
  redis-throughput-benchmarks:
    name: Run Redis Throughput Benchmarks
    runs-on: ubuntu-latest
    env:
      # The scheduled run has no inputs, so it falls back to the dispatch defaults.
      RESPIRE_THROUGHPUT_CLIENTS: ${{ inputs.concurrent-clients || '1,10,50' }}
      RESPIRE_THROUGHPUT_OPERATIONS: ${{ inputs.operations-per-client || '100' }}

    strategy:
      matrix:
        framework: [net10.0]

    steps:
      # Load infrastructure from the workflow revision, independently of benchmark source revisions.
      - name: Checkout Docker mirror action
        id: docker-mirror-checkout
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: docker-mirror
          sparse-checkout: .github/actions/docker-hub-mirror
          persist-credentials: false
      - name: Use Docker Hub mirror
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && steps.docker-mirror-checkout.outcome == 'success'
        uses: ./docker-mirror/.github/actions/docker-hub-mirror
      - name: Warn if Docker mirror action could not be loaded
        if: steps.docker-mirror-checkout.outcome == 'failure'
        shell: bash
        run: echo '::warning::Could not load Docker mirror action; pulls go straight to Docker Hub'
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Build benchmarks
        run: dotnet build benchmarks/Respire.Benchmarks -c Release -f ${{ matrix.framework }}

      - name: Run Redis Throughput Benchmarks
        working-directory: benchmarks/Respire.Benchmarks
        # One run covers every client count; the benchmark reads its params from the environment.
        run: |
          dotnet run -c Release -f ${{ matrix.framework }} --no-build -- \
            --filter "*RedisThroughputBenchmarks*" \
            --exporters json markdown html \
            --artifacts ./BenchmarkDotNet.Artifacts \
            --iterationCount 5 \
            --warmupCount 3

      - name: Generate throughput report
        if: always()
        run: |
          report=benchmarks/Respire.Benchmarks/throughput-report.md
          results=benchmarks/Respire.Benchmarks/BenchmarkDotNet.Artifacts/results
          {
            echo "## Redis Throughput Benchmark Results"
            echo ""
            echo "| Parameter | Value |"
            echo "| --- | --- |"
            echo "| Framework | ${{ matrix.framework }} |"
            echo "| Concurrent clients | $RESPIRE_THROUGHPUT_CLIENTS |"
            echo "| Operations per client | $RESPIRE_THROUGHPUT_OPERATIONS |"
            echo "| Runner | ${{ runner.os }} - ${{ runner.arch }} |"
            echo "| Date | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |"
            echo ""
            if compgen -G "$results/*-report-github.md" > /dev/null; then
              cat "$results"/*-report-github.md
            else
              echo "No benchmark results found in $results"
            fi
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redis-throughput-benchmarks-${{ matrix.framework }}
          path: |
            benchmarks/Respire.Benchmarks/BenchmarkDotNet.Artifacts/
            benchmarks/Respire.Benchmarks/throughput-report.md
          retention-days: 30
