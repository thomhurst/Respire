name: Modular Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish-packages:
        description: Publish packages?    
        type: boolean
        required: true

jobs:
  modularpipeline:
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Pull Requests' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      
      - name: NuGet login
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.publish-packages == 'true' }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Run Pipeline
        # Directory.Build.props multi-targets every project, so a framework must be picked.
        run: dotnet run -c Release -f net10.0
        working-directory: "Respire.Pipeline"
        env:
          DOTNET_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
          NuGet__ApiKey: ${{ steps.login.outputs.NUGET_API_KEY }}
          PULL_REQUEST_BRANCH: ${{ github.event.pull_request.head.ref }}
          PUBLISH_PACKAGES: ${{ github.event.inputs.publish-packages }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
