name: Modular Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish-packages:
        description: Publish packages?    
        type: boolean
        required: true
        default: false

concurrency:
  # A newer commit on the same PR or branch supersedes older runs. Every main commit still runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  modularpipeline:
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish-packages && 'Production' || 'Pull Requests' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet


      - name: NuGet login
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish-packages }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Run Pipeline
        # Directory.Build.props multi-targets every project, so a framework must be picked.
        run: dotnet run -c Release -f net10.0
        working-directory: "Respire.Pipeline"
        env:
          DOTNET_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish-packages && 'Production' || 'Development' }}
          NuGet__ApiKey: ${{ steps.login.outputs.NUGET_API_KEY }}
          PULL_REQUEST_BRANCH: ${{ github.event.pull_request.head.ref }}
          PUBLISH_PACKAGES: ${{ inputs.publish-packages }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The pipeline already packed every package, so the package checks consume those
      # rather than packing a second time in CI.
      - name: Locate packed version
        id: packages
        run: |
          package=$(find artifacts/packages -maxdepth 1 -name 'Respire.[0-9]*.nupkg' -print -quit)
          if [ -z "$package" ]; then echo "The pipeline did not pack Respire." >&2; exit 1; fi
          version=$(basename "$package" .nupkg)
          echo "version=${version#Respire.}" >> "$GITHUB_OUTPUT"

      - name: Publish generated commands with Native AOT from packed NuGet assets
        run: >-
          dotnet publish tests/Respire.GeneratedCommands.Smoke -c Release -r linux-x64
          -p:RespirePackageVersion=${{ steps.packages.outputs.version }}
          -p:RestoreAdditionalProjectSources=${{ github.workspace }}/artifacts/packages
          -o artifacts/generated-commands-smoke

      - name: Execute generated commands with RESP2 and RESP3
        shell: bash
        run: |
          container=$(docker run --rm -d -p 127.0.0.1::6379 redis:8.10-alpine)
          trap 'docker stop "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
          endpoint=$(docker port "$container" 6379/tcp)
          artifacts/generated-commands-smoke/Respire.GeneratedCommands.Smoke "$endpoint"

      - name: Compile documentation snippets
        shell: pwsh
        run: ./scripts/Verify-DocSnippets.ps1 -PackagesPath artifacts/packages -Version ${{ steps.packages.outputs.version }}

      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-unit-test-diagnostics
          path: artifacts/unit-tests/
          if-no-files-found: ignore
          retention-days: 7
