name: Aggregate progress correctness

on:
  pull_request:
    paths:
      - 'src/Respire/Protocol/**'
      - 'tests/Respire.Tests/Protocol/**'
      - '.github/workflows/aggregate-progress.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  progress:
    name: Aggregate progress (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    env:
      TUNIT_DISABLE_HTML_REPORTER: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build with causal progress instrumentation
        run: dotnet build tests/Respire.Tests -c Debug -f ${{ matrix.framework }}
      - name: Verify transfer, framing, storage and payload ownership
        run: >-
          dotnet tests/Respire.Tests/bin/Debug/${{ matrix.framework }}/Respire.Tests.dll
          --treenode-filter '/*/*/(AggregateProgressTransferTests)|(AggregatePayloadTests)|(AggregateStorageTests)|(RespParseStateTests)|(RespParserTests)|(ParserContextTests)/*'
          --minimum-expected-tests 155
