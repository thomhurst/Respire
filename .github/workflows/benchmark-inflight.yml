name: In-flight FIFO benchmarks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  # Reapplying this label supersedes its older run; unrelated labels cannot cancel it.
  # Non-label events would use an empty label segment without changing their grouping.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  inflight-comparison:
    if: github.event.label.name == 'run-inflight-benchmarks'
    name: Compare in-flight FIFO (${{ matrix.error-metrics }}, informational)
    strategy:
      fail-fast: false
      matrix:
        error-metrics: [disabled, enabled]
    env:
      RESPIRE_BENCH_ERRORS: ${{ matrix.error-metrics }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Load infrastructure from the workflow revision, independently of benchmark source revisions.
      - name: Checkout Docker mirror action
        id: docker-mirror-checkout
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: docker-mirror
          sparse-checkout: .github/actions/docker-hub-mirror
          persist-credentials: false
      - name: Use Docker Hub mirror
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && steps.docker-mirror-checkout.outcome == 'success'
        uses: ./docker-mirror/.github/actions/docker-hub-mirror
      - name: Warn if Docker mirror action could not be loaded
        if: steps.docker-mirror-checkout.outcome == 'failure'
        shell: bash
        run: echo '::warning::Could not load Docker mirror action; pulls go straight to Docker Hub'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: candidate
      - name: Verify the immutable merge and derive its baseline
        id: revisions
        shell: python
        env:
          MERGE_SHA: ${{ github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          import os, re, subprocess
          for variable in ('MERGE_SHA', 'EXPECTED_HEAD_SHA', 'EVENT_BASE_SHA'):
              assert re.fullmatch(r'[0-9a-f]{40}', os.environ[variable]), 'A pinned full SHA is required'
          actual = subprocess.check_output(['git', '-C', 'candidate', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == os.environ['MERGE_SHA'], 'Wrong candidate merge'
          parents = subprocess.check_output(['git', '-C', 'candidate', 'show', '-s', '--format=%P', 'HEAD'], text=True).split()
          assert len(parents) == 2, 'Candidate must be a two-parent PR merge'
          assert parents[1] == os.environ['EXPECTED_HEAD_SHA'], 'Wrong PR head'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              print('baseline-sha=' + parents[0], file=stream)
          with open('revisions.log', 'w') as stream:
              print('merge=' + actual, 'baseline=' + parents[0],
                    'head=' + parents[1], 'event-base=' + os.environ['EVENT_BASE_SHA'], sep='\n', file=stream)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.baseline-sha }}
          path: baseline
      - name: Compare pinned baseline, candidate, baseline on one runner
        shell: bash
        env:
          # The exported report has one disassembly per case, despite multiple launches.
          # Retain compilation tiers from every measured process to diagnose bimodal timing.
          DOTNET_JitDisasm: EnqueueAndDequeue WorkloadActionUnroll
          DOTNET_JitDisasmDiffable: '1'
        run: |
          set -euo pipefail
          # The new coverage case must run against identical sources in both checkouts.
          cp candidate/benchmarks/Respire.Benchmarks/{InflightRingBenchmarks,DiagnosticsPipelineBenchmarks,ErrorMetricBenchmarkScope}.cs baseline/benchmarks/Respire.Benchmarks/
          for phase in validation baseline-a candidate baseline-b; do
            source=baseline
            job=Medium
            filter='*InflightRingBenchmarks.EnqueueAndDequeue'
            if [ "$phase" = candidate ] || [ "$phase" = validation ]; then source=candidate; fi
            if [ "$phase" = validation ]; then job=Dry; filter='*InflightRingBenchmarks*'; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --filter "$filter" '*DiagnosticsPipelineBenchmarks*' --job "$job" --exporters json markdown --disasm --disasmDepth 3 \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require completed measurements
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          for phase in ("validation", "baseline-a", "candidate", "baseline-b"):
              log = Path(f"{phase}.log").read_text()
              enabled = os.environ["RESPIRE_BENCH_ERRORS"] == "enabled"
              marker = f"ERROR_METRICS requested={enabled}; published="
              assert marker in log, f"Missing metric selection evidence: {phase}"
              if phase in ("validation", "candidate"):
                  assert marker + "True" in log, f"Candidate errors instrument was not published: {phase}"
              assert "Assembly listing for method Respire.Benchmarks.InflightRingBenchmarks:EnqueueAndDequeue" in log, \
                  f"Missing process JIT diagnostics: {phase}"
              reports = list(Path("results", phase, "results").glob("*-report*.json"))
              assert reports, f"Missing benchmark results: {phase}"
              for report in reports:
                  benchmarks = json.loads(report.read_text())["Benchmarks"]
                  expected = 3 if "DiagnosticsPipelineBenchmarks" in report.name else 1
                  assert len(benchmarks) == expected, f"Expected {expected} benchmark cases: {report}"
                  for benchmark in benchmarks:
                      statistics = benchmark.get("Statistics")
                      assert statistics and statistics["Mean"] > 0, f"Failed benchmark: {report}"
      - name: Summarize candidate deltas against both controls
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          phases = {}
          for phase in ("baseline-a", "candidate", "baseline-b"):
              reports = list(Path("results", phase, "results").glob("*-report-full-compressed.json"))
              assert len(reports) == 2, f"Expected ring and pipeline reports: {phase}"
              cases = [case for report in reports for case in json.loads(report.read_text())["Benchmarks"]]
              phases[phase] = {(case["Type"] + "." + case["Method"], case["Parameters"]): case for case in cases}
          assert phases["baseline-a"].keys() == phases["candidate"].keys() == phases["baseline-b"].keys()
          lines = ["## Candidate versus both baseline controls", "",
                   "Positive time deltas mean slower. Control drift shows runner variation; these are informational measurements.", "",
                   "| Case | A ns | Candidate ns | B ns | Candidate/A | Candidate/B | B/A drift | Allocated B (A/candidate/B) |",
                   "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"]
          for key in sorted(phases["candidate"]):
              cases = [phases[phase][key] for phase in ("baseline-a", "candidate", "baseline-b")]
              a, candidate, b = [case["Statistics"]["Mean"] for case in cases]
              allocations = "/".join(str(case["Memory"]["BytesAllocatedPerOperation"]) for case in cases)
              lines.append(f"| {key[0]} ({key[1]}) | {a:.3f} | {candidate:.3f} | {b:.3f} | "
                           f"{100 * (candidate / a - 1):+.2f}% | {100 * (candidate / b - 1):+.2f}% | "
                           f"{100 * (b / a - 1):+.2f}% | {allocations} |")
          # Aggregating launches can hide distinct JIT/code-layout regimes. Keep each
          # process visible alongside the aggregate, and retain disassembly for diagnosis.
          lines.extend(["", "## Individual process launches", "",
                        "These are overhead-adjusted result samples, not independent repetitions of the whole experiment.", "",
                        "| Phase | Case | Launch | Mean ns | Min ns | Max ns |",
                        "| --- | --- | ---: | ---: | ---: | ---: |"])
          for phase, cases in phases.items():
              for key, case in sorted(cases.items()):
                  launches = {}
                  for measurement in case["Measurements"]:
                      if measurement["IterationStage"] == "Result" and measurement["IterationMode"] == "Workload":
                          value = measurement["Nanoseconds"] / measurement["Operations"]
                          launches.setdefault(measurement["LaunchIndex"], []).append(value)
                  assert launches, f"No per-launch result measurements: {phase}, {key}"
                  for launch, samples in sorted(launches.items()):
                      lines.append(f"| {phase} | {key[0]} ({key[1]}) | {launch} | "
                                   f"{sum(samples) / len(samples):.3f} | {min(samples):.3f} | {max(samples):.3f} |")
          summary = "\n".join(lines) + "\n"
          Path("results/comparison.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
      - name: Publish comparison reports
        if: always()
        shell: bash
        run: |
          echo "Informational A/B/A measurements; review timing and allocation reports before merge. This job does not enforce a regression threshold." >> "$GITHUB_STEP_SUMMARY"
          for phase in baseline-a candidate baseline-b; do
            echo "## $phase" >> "$GITHUB_STEP_SUMMARY"
            for report in "$GITHUB_WORKSPACE/results/$phase/results/"*-report-default.md; do
              if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: inflight-fifo-comparison-${{ matrix.error-metrics }}
          path: |
            results/
            *.log
