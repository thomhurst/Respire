name: Partial hash read benchmarks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  # Reapplying the benchmark label supersedes older runs on the same PR.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hash-partial-reads-comparison:
    if: github.event.label.name == 'run-hash-partial-reads-benchmarks'
    name: Compare partial hash reads (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.10@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Compare pinned baseline, candidate, baseline on one runner
        shell: bash
        run: |
          set -euo pipefail
          # The shared fixture must compile against both pinned APIs. A mismatch fails this
          # step; the always() upload below retains its phase log without masking that failure.
          cp candidate/benchmarks/Respire.Benchmarks/HashPartialReadBenchmarks.cs baseline/benchmarks/Respire.Benchmarks/
          for phase in validation baseline-a candidate baseline-b; do
            source=baseline
            job=Medium
            filter='*HashPartialReadBenchmarks*'
            export RESPIRE_BENCH_BASELINE=1
            if [ "$phase" = candidate ] || [ "$phase" = validation ]; then
              source=candidate
              export RESPIRE_BENCH_BASELINE=0
            fi
            if [ "$phase" = validation ]; then job=Dry; fi
            (
              cd "$source"
              git rev-parse HEAD
              dotnet run --project benchmarks/Respire.Benchmarks -c Release -f net10.0 -- \
                --filter "$filter" --job "$job" --exporters json markdown \
                --artifacts "$GITHUB_WORKSPACE/results/$phase"
            ) > "$GITHUB_WORKSPACE/$phase.log" 2>&1
          done
      - name: Require completed measurements
        shell: python
        run: |
          import json
          from pathlib import Path
          for phase in ("validation", "baseline-a", "candidate", "baseline-b"):
              reports = list(Path("results", phase, "results").glob("*-report*.json"))
              assert reports, f"Missing benchmark results: {phase}"
              for report in reports:
                  benchmarks = json.loads(report.read_text())["Benchmarks"]
                  expected = 6 if phase in ("candidate", "validation") else 3
                  assert len(benchmarks) == expected, f"Wrong hit-ratio/mode count: {report}"
                  for benchmark in benchmarks:
                      statistics = benchmark.get("Statistics")
                      assert statistics and statistics["Mean"] > 0, f"Failed benchmark: {report}"
      - name: Summarize candidate deltas against both controls
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          phases = {}
          for phase in ("baseline-a", "candidate", "baseline-b"):
              reports = list(Path("results", phase, "results").glob("*-report-full-compressed.json"))
              assert len(reports) == 1, f"Expected one complete report: {phase}"
              cases = json.loads(reports[0].read_text())["Benchmarks"]
              phases[phase] = {(case["Method"], case["Parameters"]): case for case in cases}
          assert phases["baseline-a"].keys() == phases["baseline-b"].keys()
          assert phases["baseline-a"].keys() < phases["candidate"].keys()
          lines = ["## Candidate versus both baseline controls", "",
                   "Positive time deltas mean slower. Control drift shows runner variation; these are informational measurements.", "",
                   "| Case | A ns | Candidate ns | B ns | Candidate/A | Candidate/B | B/A drift | Allocated B (A/candidate/B) |",
                   "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"]
          for key in sorted(phases["candidate"]):
              baseline_key = (key[0], key[1].replace("ReuseHashFields=True", "ReuseHashFields=False"))
              cases = [phases["baseline-a"][baseline_key], phases["candidate"][key], phases["baseline-b"][baseline_key]]
              a, candidate, b = [case["Statistics"]["Mean"] for case in cases]
              if "ReuseHashFields=False" in key[1] and "CachedFields=4" in key[1]:
                  assert cases[1]["Memory"]["BytesAllocatedPerOperation"] <= min(
                      cases[0]["Memory"]["BytesAllocatedPerOperation"], cases[2]["Memory"]["BytesAllocatedPerOperation"]), key
              allocations = "/".join(str(case["Memory"]["BytesAllocatedPerOperation"]) for case in cases)
              lines.append(f"| {key[0]} ({key[1]}) | {a:.3f} | {candidate:.3f} | {b:.3f} | "
                           f"{100 * (candidate / a - 1):+.2f}% | {100 * (candidate / b - 1):+.2f}% | "
                           f"{100 * (b / a - 1):+.2f}% | {allocations} |")
          summary = "\n".join(lines) + "\n"
          Path("results/comparison.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
      - name: Summarize diagnostic process CPU
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          prefix = "HASH_PARTIAL_PROCESS_METRICS "
          lines = ["## Diagnostic process CPU", "",
                   "Includes priming, warmup, calibration, and background work; not isolated operation CPU.", "",
                   "| Phase | Reuse fields | Cached fields | Reads | CPU ms | Wall seconds |",
                   "| --- | --- | ---: | ---: | ---: | ---: |"]
          records = []
          for phase in ("baseline-a", "candidate", "baseline-b"):
              found = []
              for line in Path(f"{phase}.log").read_text().splitlines():
                  if line.startswith(prefix):
                      record = json.loads(line[len(prefix):])
                      record["phase"] = phase
                      found.append(record)
                      lines.append(f"| {phase} | {record['ReuseHashFields']} | {record['CachedFields']} | {record['reads']} | "
                                   f"{record['cpuMilliseconds']:.3f} | {record['elapsedSeconds']:.3f} |")
              modes = (False, True) if phase == "candidate" else (False,)
              assert {(record["ReuseHashFields"], record["CachedFields"]) for record in found} == {(mode, fields) for mode in modes for fields in (0, 2, 4)}
              assert all(record["reads"] > 0 and record["cpuMilliseconds"] >= 0 for record in found)
              records.extend(found)
          Path("results/process-metrics.json").write_text(json.dumps(records, indent=2))
          summary = "\n".join(lines) + "\n"
          Path("results/process-metrics.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
      - name: Publish comparison reports
        if: always()
        shell: bash
        run: |
          for phase in baseline-a candidate baseline-b; do
            echo "## $phase" >> "$GITHUB_STEP_SUMMARY"
            for report in "$GITHUB_WORKSPACE/results/$phase/results/"*-report-default.md; do
              if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hash-partial-reads-comparison
          path: |
            results/
            *.log
