name: Completion buffer benchmarks

on:
  pull_request:
    paths:
      - 'src/Respire/Networking/CompletionScheduler.cs'
      - 'benchmarks/Respire.Benchmarks/ByteGetBenchmarks.cs'
      - '.github/workflows/benchmark-completion-buffers.yml'
      - '.github/workflows/benchmark-compare.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  large-values:
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/ByteGetBenchmarks.cs
      filter: '*ByteGetBenchmarks*'
      expected-case-count: 4
      expected-methods: GetBytes,GetTypedBytes
      artifact-prefix: completion-buffer-large-values
