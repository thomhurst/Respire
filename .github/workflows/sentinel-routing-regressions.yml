name: Sentinel routing regressions

on:
  pull_request:
    paths:
      - 'src/Respire/**'
      - 'tests/Respire.Tests/Networking/Sentinel*'
      - 'tests/Respire.IntegrationTests/Sentinel*'
      - '.github/workflows/sentinel-routing-regressions.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sentinel:
    name: Sentinel uninstrumented routing (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    env:
      # TUnit's HTML reporter listens to every ActivitySource. Exercise the direct
      # reply sources here; the ordinary full test matrix covers instrumented routing.
      TUNIT_DISABLE_HTML_REPORTER: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify Sentinel routing, retirement, and cancellation
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: >-
          dotnet run --project tests/Respire.Tests -c Release -f "$FRAMEWORK" --
          --treenode-filter '/*/*/Sentinel*Tests/*' --minimum-expected-tests 16
          --report-trx --results-directory results/unit
      - name: Verify real Sentinel clients and failover
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: >-
          dotnet run --project tests/Respire.IntegrationTests -c Release -f "$FRAMEWORK" --
          --treenode-filter '/*/*/Sentinel*IntegrationTests/*' --minimum-expected-tests 6 --maximum-parallel-tests 2
          --report-trx --results-directory results/integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sentinel-routing-${{ matrix.framework }}
          path: results/
          retention-days: 30
