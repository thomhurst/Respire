name: Stress Tests

on:
  schedule:
    - cron: '0 2 * * 0' # Weekly Sunday 2 AM UTC: all scenarios, both clients, defaults below
  workflow_dispatch:
    inputs:
      full_run:
        description: 'Run the complete comparison and publish it to the documentation'
        required: false
        default: false
        type: boolean
      duration_minutes:
        description: 'Measured minutes per scenario/client pass (runtime ≈ passes × duration; all scenarios + both clients = 14 passes)'
        required: false
        default: '3'
      scenario:
        description: 'Scenario to run'
        required: false
        default: all
        type: choice
        options:
          - all
          - ping
          - get
          - set
          - incr
          - hash
          - list
          - mixed
      client:
        description: 'Client to run'
        required: false
        default: all
        type: choice
        options:
          - all
          - respire
          - stackexchange
      concurrency:
        description: 'Concurrent workers per pass'
        required: false
        default: '50'
      value_size_bytes:
        description: 'Payload size in bytes for written values'
        required: false
        default: '1024'
      framework:
        description: 'Target framework'
        required: false
        default: net10.0
        type: choice
        options:
          - net10.0
          - net8.0

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

# Sustained runs on the same ref queue rather than interleave; results from a
# cancelled half-run are worthless.
concurrency:
  group: stress-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    name: Stress (${{ github.event.inputs.framework || 'net10.0' }})
    runs-on: ubuntu-latest
    timeout-minutes: 300

    services:
      redis:
        image: redis:8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build stress tests
        run: dotnet build tools/Respire.StressTests -c Release

      - name: Resolve test scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_RUN: ${{ github.event.inputs.full_run || 'false' }}
          REQUESTED_SCENARIO: ${{ github.event.inputs.scenario || 'all' }}
          REQUESTED_CLIENT: ${{ github.event.inputs.client || 'all' }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$FULL_RUN" = "true" ]; then
            echo "scenario=all" >> "$GITHUB_OUTPUT"
            echo "client=all" >> "$GITHUB_OUTPUT"
          else
            echo "scenario=$REQUESTED_SCENARIO" >> "$GITHUB_OUTPUT"
            echo "client=$REQUESTED_CLIENT" >> "$GITHUB_OUTPUT"
          fi

      # Inputs flow through env vars, not string interpolation into the script,
      # to avoid script injection via crafted input values.
      - name: Run stress tests
        working-directory: tools/Respire.StressTests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          STRESS_DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '3' }}
          STRESS_SCENARIO: ${{ steps.scope.outputs.scenario }}
          STRESS_CLIENT: ${{ steps.scope.outputs.client }}
          STRESS_CONCURRENCY: ${{ github.event.inputs.concurrency || '50' }}
          STRESS_VALUE_SIZE: ${{ github.event.inputs.value_size_bytes || '1024' }}
          STRESS_FRAMEWORK: ${{ github.event.inputs.framework || 'net10.0' }}
        run: |
          dotnet run -c Release -f "$STRESS_FRAMEWORK" --no-build -- \
            --duration "$STRESS_DURATION_MINUTES" \
            --scenario "$STRESS_SCENARIO" \
            --client "$STRESS_CLIENT" \
            --concurrency "$STRESS_CONCURRENCY" \
            --value-size "$STRESS_VALUE_SIZE" \
            --output ./results

      - name: Publish report to job summary
        if: always()
        run: |
          REPORT="tools/Respire.StressTests/results/stress-report.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No stress report was produced (the run failed before reporting)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stress-results-${{ github.event.inputs.framework || 'net10.0' }}
          path: tools/Respire.StressTests/results/
          retention-days: 90

  publish-to-docs:
    name: Publish stress-test documentation
    needs: stress
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event.inputs.full_run == 'true')
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write

    concurrency:
      group: performance-docs-publish
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download stress-test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: stress-results-*
          path: stress-results

      - name: Generate stress-test documentation
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/stress_docs.py \
            --results-dir stress-results \
            --commit "${{ github.sha }}" \
            --generated-at "$(date -u +'%Y-%m-%d %H:%M UTC')" \
            --run-url "$RUN_URL" \
            --output website/docs/stress-tests.md

      - name: Commit stress-test documentation
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/docs/stress-tests.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs: update stress-test results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated documentation
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
