name: Connection establishment benchmarks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.label.name == 'run-connection-establishment-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/ConnectionEstablishmentBenchmarks.cs
      filter: '*ConnectionEstablishmentBenchmarks*'
      expected-case-count: 4
      expected-methods: ConnectAndDispose,HealthyPing
      artifact-prefix: connection-establishment-comparison
      redis-server: true
