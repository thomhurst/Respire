name: Agent Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/Invoke-AgentDotNet.ps1
      - scripts/AgentDotNetWindowsJob.cs
      - scripts/Write-AgentWindowsStartupDiagnostics.ps1
      - scripts/Test-AgentWindowsStartupDiagnostics.ps1
      - scripts/Test-AgentDotNetWindowsHandles.ps1
      - scripts/Test-InvokeAgentDotNet.ps1
      - scripts/Test-AgentDotNetArguments.ps1
      - scripts/Test-AgentDotNetArgumentsDiagnostics.ps1
      - scripts/Test-AgentDotNetMtp.ps1
      - scripts/Test-AgentDotNetMtpDiagnostics.ps1
      - scripts/Test-AgentDotNetVstest.ps1
      - scripts/Test-AgentDotNetVstestDiagnostics.ps1
      - scripts/Test-AgentDotNetSdkProbe.ps1
      - scripts/AssertPrGreenReviewHeuristics.ps1
      - scripts/Assert-PrGreen.ps1
      - scripts/Merge-Pr.ps1
      - scripts/Test-PrMergeHead.ps1
      - scripts/Test-AssertPrGreenReviewHeuristics.ps1
      - .github/scripts/pr-review-comment.sh
      - .github/scripts/test-pr-review-comment.sh
      - .github/scripts/claude-request-permission.sh
      - .github/scripts/test-claude-request-permission.sh
      - .github/scripts/claude-request-revision.sh
      - .github/scripts/test-claude-request-revision.sh
      - .github/workflows/claude.yml
      - .github/workflows/claude-code-review.yml
      - .github/workflows/agent-guard.yml
  push:
    branches: [main]
    paths:
      - scripts/Invoke-AgentDotNet.ps1
      - scripts/AgentDotNetWindowsJob.cs
      - scripts/Write-AgentWindowsStartupDiagnostics.ps1
      - scripts/Test-AgentWindowsStartupDiagnostics.ps1
      - scripts/Test-AgentDotNetWindowsHandles.ps1
      - scripts/Test-InvokeAgentDotNet.ps1
      - scripts/Test-AgentDotNetArguments.ps1
      - scripts/Test-AgentDotNetArgumentsDiagnostics.ps1
      - scripts/Test-AgentDotNetMtp.ps1
      - scripts/Test-AgentDotNetMtpDiagnostics.ps1
      - scripts/Test-AgentDotNetVstest.ps1
      - scripts/Test-AgentDotNetVstestDiagnostics.ps1
      - scripts/Test-AgentDotNetSdkProbe.ps1
      - scripts/AssertPrGreenReviewHeuristics.ps1
      - scripts/Assert-PrGreen.ps1
      - scripts/Merge-Pr.ps1
      - scripts/Test-PrMergeHead.ps1
      - scripts/Test-AssertPrGreenReviewHeuristics.ps1
      - .github/scripts/pr-review-comment.sh
      - .github/scripts/test-pr-review-comment.sh
      - .github/scripts/claude-request-permission.sh
      - .github/scripts/test-claude-request-permission.sh
      - .github/scripts/claude-request-revision.sh
      - .github/scripts/test-claude-request-revision.sh
      - .github/workflows/claude.yml
      - .github/workflows/claude-code-review.yml
      - .github/workflows/agent-guard.yml

permissions:
  contents: read

concurrency:
  # A newer commit on the same PR or branch supersedes older runs. Every main commit still runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guard:
    name: Agent Guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify native arguments and SingleNode
        shell: pwsh
        run: ./scripts/Test-AgentDotNetArguments.ps1 -DiagnosticsDirectory '${{ runner.temp }}/agent-guard-arguments'
      - name: Retain native argument diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-guard-arguments-${{ matrix.os }}
          path: ${{ runner.temp }}/agent-guard-arguments
          if-no-files-found: warn
          retention-days: 7
      - name: Verify native argument diagnostic failure handling
        shell: pwsh
        run: ./scripts/Test-AgentDotNetArgumentsDiagnostics.ps1
      - name: Verify Windows standard-handle inheritance
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-AgentDotNetWindowsHandles.ps1
      - name: Verify Windows startup failure evidence preserves exit and cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-AgentWindowsStartupDiagnostics.ps1
      - name: Verify MTP discovery, execution, and failure propagation
        shell: pwsh
        run: ./scripts/Test-AgentDotNetMtp.ps1 -DiagnosticsDirectory '${{ runner.temp }}/agent-guard-mtp'
      - name: Verify MTP diagnostics cannot interrupt cleanup
        shell: pwsh
        run: ./scripts/Test-AgentDotNetMtpDiagnostics.ps1
      - name: Retain MTP diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-guard-mtp-${{ matrix.os }}
          path: ${{ runner.temp }}/agent-guard-mtp
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify VSTest discovery and execution
        shell: pwsh
        run: ./scripts/Test-AgentDotNetVstest.ps1 -DiagnosticsDirectory '${{ runner.temp }}/agent-guard-vstest'
      - name: Verify VSTest diagnostics cannot interrupt cleanup
        shell: pwsh
        run: ./scripts/Test-AgentDotNetVstestDiagnostics.ps1
      - name: Retain VSTest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-guard-vstest-${{ matrix.os }}
          path: ${{ runner.temp }}/agent-guard-vstest
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify SDK probe containment and resource limits
        shell: pwsh
        run: ./scripts/Test-AgentDotNetSdkProbe.ps1
      - name: Verify process containment and resource limits
        shell: pwsh
        run: ./scripts/Test-InvokeAgentDotNet.ps1
      - name: Verify PR review gate heuristics
        shell: pwsh
        run: ./scripts/Test-AssertPrGreenReviewHeuristics.ps1
      - name: Verify merge head binding
        shell: pwsh
        run: ./scripts/Test-PrMergeHead.ps1
      - name: Verify review comment helper
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/test-pr-review-comment.sh
      - name: Verify Claude request authorization
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/test-claude-request-permission.sh
      - name: Verify Claude request revision
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/test-claude-request-revision.sh

  runner-overrides:
    name: SDK runner overrides (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.100-preview.7.26381.103
      - name: Environment MTP overrides global VSTest on the supporting SDK
        shell: pwsh
        run: ./scripts/Test-AgentDotNetMtp.ps1 -SdkVersion 11.0.100-preview.7.26381.103 -DiagnosticsDirectory '${{ runner.temp }}/agent-guard-mtp'
      - name: Environment VSTest overrides global MTP on the supporting SDK
        shell: pwsh
        run: ./scripts/Test-AgentDotNetVstest.ps1 -SdkVersion 11.0.100-preview.7.26381.103 -DiagnosticsDirectory '${{ runner.temp }}/agent-guard-vstest'
      - name: Retain VSTest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-guard-vstest-overrides-${{ matrix.os }}
          path: ${{ runner.temp }}/agent-guard-vstest
          if-no-files-found: ignore
          retention-days: 7
      - name: Resolve a supporting SDK through roll-forward from the .NET 10 pin
        shell: pwsh
        run: ./scripts/Test-AgentDotNetMtp.ps1 -RollForwardAcrossMajor -DiagnosticsDirectory '${{ runner.temp }}/agent-guard-mtp'
      - name: Retain MTP diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-guard-mtp-overrides-${{ matrix.os }}
          path: ${{ runner.temp }}/agent-guard-mtp
          if-no-files-found: ignore
          retention-days: 7
