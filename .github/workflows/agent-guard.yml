name: Agent Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/Invoke-AgentDotNet.ps1
      - scripts/Test-InvokeAgentDotNet.ps1
      - scripts/Test-AgentDotNetArguments.ps1
      - scripts/AssertPrGreenReviewHeuristics.ps1
      - scripts/Test-AssertPrGreenReviewHeuristics.ps1
      - .github/workflows/agent-guard.yml
  push:
    branches: [main]
    paths:
      - scripts/Invoke-AgentDotNet.ps1
      - scripts/Test-InvokeAgentDotNet.ps1
      - scripts/Test-AgentDotNetArguments.ps1
      - scripts/AssertPrGreenReviewHeuristics.ps1
      - scripts/Test-AssertPrGreenReviewHeuristics.ps1
      - .github/workflows/agent-guard.yml

permissions:
  contents: read

concurrency:
  # A newer commit on the same PR or branch supersedes older runs. Every main commit still runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guard:
    name: Agent Guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify native arguments and SingleNode
        shell: pwsh
        run: ./scripts/Test-AgentDotNetArguments.ps1
      - name: Verify process containment and resource limits
        shell: pwsh
        run: ./scripts/Test-InvokeAgentDotNet.ps1
      - name: Verify PR review gate heuristics
        shell: pwsh
        run: ./scripts/Test-AssertPrGreenReviewHeuristics.ps1
