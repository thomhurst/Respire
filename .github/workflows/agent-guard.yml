name: Agent Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/Invoke-AgentDotNet.ps1
      - scripts/Test-InvokeAgentDotNet.ps1
      - scripts/Test-AgentDotNetArguments.ps1
      - scripts/Test-AgentDotNetMtp.ps1
      - scripts/Test-AgentDotNetVstest.ps1
      - scripts/Test-AgentDotNetSdkProbe.ps1
      - scripts/AssertPrGreenReviewHeuristics.ps1
      - scripts/Assert-PrGreen.ps1
      - scripts/Merge-Pr.ps1
      - scripts/Test-PrMergeHead.ps1
      - scripts/Test-AssertPrGreenReviewHeuristics.ps1
      - .github/scripts/pr-review-comment.sh
      - .github/scripts/test-pr-review-comment.sh
      - .github/scripts/claude-request-permission.sh
      - .github/scripts/test-claude-request-permission.sh
      - .github/scripts/claude-request-revision.sh
      - .github/scripts/test-claude-request-revision.sh
      - .github/workflows/claude.yml
      - .github/workflows/claude-code-review.yml
      - .github/workflows/agent-guard.yml
  push:
    branches: [main]
    paths:
      - scripts/Invoke-AgentDotNet.ps1
      - scripts/Test-InvokeAgentDotNet.ps1
      - scripts/Test-AgentDotNetArguments.ps1
      - scripts/Test-AgentDotNetMtp.ps1
      - scripts/Test-AgentDotNetVstest.ps1
      - scripts/Test-AgentDotNetSdkProbe.ps1
      - scripts/AssertPrGreenReviewHeuristics.ps1
      - scripts/Assert-PrGreen.ps1
      - scripts/Merge-Pr.ps1
      - scripts/Test-PrMergeHead.ps1
      - scripts/Test-AssertPrGreenReviewHeuristics.ps1
      - .github/scripts/pr-review-comment.sh
      - .github/scripts/test-pr-review-comment.sh
      - .github/scripts/claude-request-permission.sh
      - .github/scripts/test-claude-request-permission.sh
      - .github/scripts/claude-request-revision.sh
      - .github/scripts/test-claude-request-revision.sh
      - .github/workflows/claude.yml
      - .github/workflows/claude-code-review.yml
      - .github/workflows/agent-guard.yml

permissions:
  contents: read

concurrency:
  # A newer commit on the same PR or branch supersedes older runs. Every main commit still runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guard:
    name: Agent Guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify native arguments and SingleNode
        shell: pwsh
        run: ./scripts/Test-AgentDotNetArguments.ps1
      - name: Verify MTP discovery, execution, and failure propagation
        shell: pwsh
        run: ./scripts/Test-AgentDotNetMtp.ps1
      - name: Verify VSTest discovery and execution
        shell: pwsh
        run: ./scripts/Test-AgentDotNetVstest.ps1
      - name: Verify SDK probe containment and resource limits
        shell: pwsh
        run: ./scripts/Test-AgentDotNetSdkProbe.ps1
      - name: Verify process containment and resource limits
        shell: pwsh
        run: ./scripts/Test-InvokeAgentDotNet.ps1
      - name: Verify PR review gate heuristics
        shell: pwsh
        run: ./scripts/Test-AssertPrGreenReviewHeuristics.ps1
      - name: Verify merge head binding
        shell: pwsh
        run: ./scripts/Test-PrMergeHead.ps1
      - name: Verify review comment helper
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/test-pr-review-comment.sh
      - name: Verify Claude request authorization
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/test-claude-request-permission.sh
      - name: Verify Claude request revision
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/test-claude-request-revision.sh

  runner-overrides:
    name: SDK runner overrides (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.100-preview.7.26381.103
      - name: Environment MTP overrides global VSTest on the supporting SDK
        shell: pwsh
        run: ./scripts/Test-AgentDotNetMtp.ps1 -SdkVersion 11.0.100-preview.7.26381.103
      - name: Environment VSTest overrides global MTP on the supporting SDK
        shell: pwsh
        run: ./scripts/Test-AgentDotNetVstest.ps1 -SdkVersion 11.0.100-preview.7.26381.103
      - name: Resolve a supporting SDK through roll-forward from the .NET 10 pin
        shell: pwsh
        run: ./scripts/Test-AgentDotNetMtp.ps1 -RollForwardAcrossMajor
