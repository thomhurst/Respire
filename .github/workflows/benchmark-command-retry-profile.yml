name: Command retry script profiles

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.label.name == 'run-command-retry-profile-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/CommandRetryBenchmarks.cs
      filter: '*CommandRetryScriptProfileBenchmarks.ScriptLength*'
      expected-case-count: 3
      expected-methods: ScriptLength
      artifact-prefix: command-retry-script-profile
      redis-server: true
      retained-memory: true
      require-eventpipe-traces: true
      retained-memory-stages: before-connect,connected-idle,after-churn,after-dispose
      retained-memory-group-field: policy
      retained-memory-group-values: Default,Disabled,Enabled
