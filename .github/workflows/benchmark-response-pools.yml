name: Response pool benchmarks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.label.name == 'run-response-pools-benchmarks'
    uses: ./.github/workflows/benchmark-compare.yml
    with:
      event-base-sha: ${{ github.event.pull_request.base.sha }}
      candidate-sha: ${{ github.sha }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      fixture: benchmarks/Respire.Benchmarks/ResponsePoolBenchmarks.cs
      filter: '*ResponsePoolBenchmarks*'
      expected-case-count: 4
      expected-methods: GetPipeline,ConcurrentGetPipelines,GetSmallValue,GetLargeValue
      retained-memory: true
      artifact-prefix: response-pool-comparison
